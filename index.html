<html>
<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NGSL 1.2 英语词汇学习工具</title>
<style>
:root {
  --bg: #f6f7f9;
  --card: #ffffff;
  --text: #1f2328;
  --muted: #6b7280;
  --border: #e1e4e8;
  --primary: #4c7dff;
  --primary-soft: #eef3ff;
  --danger: #d64545;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
  --modal-bg: rgba(15, 18, 22, 0.45);
  --toast-bg: #1f2328;
  --toast-text: #f9fafb;
  --dropdown-bg: var(--card);
  --dropdown-shadow: 0 8px 20px rgba(0,0,0,0.12);
}
[data-theme="dark"] {
  --bg: #0f1115;
  --card: #181c23;
  --text: #e7eaee;
  --muted: #8a94a3;
  --border: #2b323d;
  --primary: #6d95ff;
  --primary-soft: #1c2434;
  --danger: #ff7b7b;
  --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
  --modal-bg: rgba(0, 0, 0, 0.65);
  --toast-bg: #2a313c;
  --toast-text: #ffffff;
  --dropdown-bg: #1f262f;
  --dropdown-shadow: 0 8px 20px rgba(0,0,0,0.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  line-height: 1.5;
  transition: background .3s ease, color .3s ease;
}
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 18px 20px 60px;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 16px;
}
h1 {
  font-size: 1.5rem;
  margin: 0;
  letter-spacing: .01em;
}
.subtitle {
  margin: 2px 0 0;
  color: var(--muted);
  font-size: .85rem;
}
.icon-btn {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 8px 12px;
  font-size: 1.1rem;
  cursor: pointer;
  color: var(--text);
  transition: border-color .2s ease, background .2s ease;
}
.icon-btn:hover { border-color: var(--primary); }
.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 10px 12px;
  box-shadow: var(--shadow);
  transition: background .3s ease, border-color .3s ease;
  position: relative;
}
.btn {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  border-radius: 10px;
  padding: 7px 11px;
  font-size: .85rem;
  cursor: pointer;
  transition: background .2s ease, border-color .2s ease, color .2s ease;
  white-space: nowrap;
  position: relative;
}
.btn:hover { border-color: var(--primary); }
.btn.active {
  background: var(--primary-soft);
  border-color: var(--primary);
  color: var(--primary);
  font-weight: 600;
}
.btn-small {
  padding: 5px 9px;
  font-size: .78rem;
}
.select, .search {
  border: 1px solid var(--border);
  background: var(--bg);
  color: var(--text);
  border-radius: 10px;
  padding: 7px 10px;
  font-size: .85rem;
  outline: none;
  transition: border-color .2s ease;
}
.select:focus, .search:focus { border-color: var(--primary); }
.search {
  flex: 1 1 180px;
  min-width: 160px;
}
.selection-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  margin: 10px 0;
  background: var(--primary-soft);
  border: 1px solid var(--primary);
  border-radius: 14px;
  padding: 8px 12px;
  color: var(--primary);
  font-size: .9rem;
}
.hidden { display: none !important; }
.stats {
  display: flex;
  flex-wrap: wrap;
  gap: 18px;
  color: var(--muted);
  font-size: .82rem;
  margin: 12px 2px 8px;
}
.stats strong { color: var(--text); font-weight: 600; }
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
  margin-top: 12px;
}
.card {
  position: relative;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 14px 14px 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
  transition: border-color .2s ease, background .2s ease, transform .1s ease;
  display: flex;
  align-items: flex-start;
  gap: 8px;
  /* 禁止点击卡片本身触发任何操作，但内部按钮和复选框仍可点击 */
  cursor: default;
}
.card:hover {
  border-color: var(--primary);
  transform: translateY(-1px);
}
.card.is-marked {
  border-color: color-mix(in srgb, var(--primary) 45%, var(--border));
}
.card-main { flex: 1; min-width: 0; }
.card-word-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  min-width: 0;
}
.card-check {
  flex-shrink: 0;
  width: 17px;
  height: 17px;
  accent-color: var(--primary);
  cursor: pointer;
}
.card-word {
  font-size: 1.55rem;
  font-weight: 700;
  line-height: 1.2;
  word-break: break-word;
  flex: 1;
  /* 点击单词不触发任何操作，但如果是背词模式下的隐藏，点击卡片本身不操作，但隐藏状态由图标控制？这里保留点击卡片不操作，隐藏单词功能仍然通过按钮切换，但卡片点击不显示单词，之前是点击卡片切换reveal，现在取消 */
}
.card-word.hidden-word {
  filter: blur(7px);
  user-select: none;
}
.card-level {
  font-size: .72rem;
  color: var(--muted);
  white-space: nowrap;
  margin-left: auto;
  letter-spacing: .02em;
}
.level-a1 { color: #7aa373; }
.level-a2 { color: #85a36f; }
.level-b1 { color: #a5955f; }
.level-b2 { color: #a97a5f; }
.level-c1 { color: #8f6f96; }
.level-c2 { color: #5f7f99; }
.level-unknown { color: var(--muted); }
.card-def {
  font-size: .88rem;
  color: var(--text);
  margin-top: 7px;
  overflow: hidden;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  line-height: 1.4;
}
.card-meta {
  margin-top: 8px;
  font-size: .65rem;
  color: var(--muted);
  letter-spacing: .03em;
}
.card-detail {
  background: transparent;
  border: 0;
  color: var(--muted);
  cursor: pointer;
  font-size: 1.3rem;
  padding: 2px 4px;
  border-radius: 8px;
  flex-shrink: 0;
  margin-top: -2px;
  transition: color .2s ease, background .2s ease;
  line-height: 1;
}
.card-detail:hover { color: var(--primary); background: var(--primary-soft); }
.empty, .load-error {
  grid-column: 1 / -1;
  text-align: center;
  color: var(--muted);
  padding: 40px 20px;
  background: var(--card);
  border: 1px dashed var(--border);
  border-radius: 16px;
}
.load-error h2 { margin-top: 0; color: var(--danger); }
.pagination {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 12px;
  margin-top: 18px;
}
.page-btn {
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 10px;
  width: 36px;
  height: 34px;
  cursor: pointer;
  font-size: 1.1rem;
  transition: border-color .2s ease, background .2s ease;
}
.page-btn:hover:not(:disabled) { border-color: var(--primary); }
.page-btn:disabled { opacity: .4; cursor: not-allowed; }
.page-info { color: var(--muted); font-size: .85rem; }
.modal-overlay {
  position: fixed;
  inset: 0;
  background: var(--modal-bg);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 50;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 20px;
  max-width: 480px;
  width: 100%;
  max-height: 85vh;
  overflow-y: auto;
  padding: 22px 22px 26px;
  box-shadow: 0 24px 64px rgba(0, 0, 0, 0.18);
  position: relative;
}
.modal-close {
  position: absolute;
  top: 12px;
  right: 14px;
  background: transparent;
  border: 0;
  color: var(--muted);
  font-size: 1.7rem;
  cursor: pointer;
  line-height: 1;
}
.modal-close:hover { color: var(--danger); }
.modal-word {
  font-size: 2rem;
  font-weight: 800;
  margin: 0 0 16px;
  padding-right: 30px;
  word-break: break-word;
}
.modal-field {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
  font-size: .92rem;
}
.modal-field:last-child { border-bottom: 0; }
.modal-label {
  min-width: 105px;
  color: var(--muted);
  font-size: .78rem;
  flex-shrink: 0;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: .02em;
}
.modal-value {
  color: var(--text);
  font-weight: 400;
  word-break: break-word;
}
.modal-value.pronunciation {
  font-style: italic;
  color: var(--muted);
}
.modal-value.level {
  font-weight: 600;
}
.modal-value.rank {
  font-family: monospace;
  font-size: .85rem;
}
/* 辅助信息（SFI, U Value）使用更小的字体 */
.modal-field.aux {
  font-size: .8rem;
}
.modal-field.aux .modal-label {
  font-size: .7rem;
}

/* 下拉菜单样式 */
.dropdown {
  position: relative;
  display: inline-block;
}
.dropdown-menu {
  display: none;
  position: absolute;
  top: 110%;
  left: 0;
  background: var(--dropdown-bg);
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--dropdown-shadow);
  min-width: 160px;
  padding: 6px 0;
  z-index: 20;
  list-style: none;
}
.dropdown-menu.open {
  display: block;
}
.dropdown-menu li {
  padding: 6px 16px;
  cursor: pointer;
  font-size: .85rem;
  white-space: nowrap;
  color: var(--text);
  transition: background .15s ease;
}
.dropdown-menu li:hover {
  background: var(--primary-soft);
  color: var(--primary);
}
.dropdown-menu li:active {
  background: var(--primary);
  color: #fff;
}
.dropdown-menu li.divider {
  border-top: 1px solid var(--border);
  margin: 4px 8px;
  padding: 0;
  cursor: default;
}
.dropdown-menu li.divider:hover {
  background: transparent;
}

.toast {
  position: fixed;
  bottom: 28px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--toast-bg);
  color: var(--toast-text);
  padding: 10px 18px;
  border-radius: 999px;
  font-size: .88rem;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s ease, transform .3s ease;
  z-index: 100;
  white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }
@media (max-width: 620px) {
  .toolbar { gap: 6px; padding: 8px; }
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .card-word { font-size: 1.3rem; }
  .modal { padding: 18px; }
  .modal-label { min-width: 80px; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <div>
      <h1>NGSL 1.2 词汇学习</h1>
    </div>
    <button id="btn-theme" class="icon-btn" aria-label="切换主题">🌙</button>
  </header>

  <section class="toolbar">
    <button id="btn-filter-unknown" class="btn active">仅生词</button>
    <button id="btn-filter-all" class="btn">全部</button>

    <select id="level-select" class="select" aria-label="等级筛选">
      <option value="all">全部等级</option>
      <option value="A1">A1</option>
      <option value="A2">A2</option>
      <option value="B1">B1</option>
      <option value="B2">B2</option>
      <option value="C1">C1</option>
      <option value="C2">C2</option>
    </select>

    <input id="search-input" class="search" type="search" placeholder="搜索单词 / 释义 / 词形 " autocomplete="off">

    <button id="btn-random-all" class="btn">全部随机</button>
    <button id="btn-random-unknown" class="btn">生词随机</button>
    <button id="btn-reset-sort" class="btn">重置排序</button>
    <button id="btn-hide-word" class="btn">隐藏单词</button>
    <button id="btn-pagination-toggle" class="btn">分页：开</button>
    <button id="btn-selection" class="btn">选择</button>

    <!-- 单词表按钮（下拉菜单） -->
    <div class="dropdown" id="wordlist-dropdown">
      <button class="btn" id="btn-wordlist">📚 单词表</button>
      <ul class="dropdown-menu" id="wordlist-menu">
        <li data-url="NGSL&Means.html">NGSL释义</li>
        <li data-url="NGSL1.1网页.html">NGSL1.1</li>
        <li data-url="Oxford3000_CEFR_level[US].pdf">Oxford3000_CEFR</li>
        <li data-url="雅思核心词汇4000词[分类].pdf">雅思4000词分类</li>
        <li data-url="高考3500词频表.pdf">高考3500词</li>
        <li data-url="100个句子3500个高考单词.pdf">100句子3500高考单词</li>
      </ul>
    </div>

    <!-- 导入/导出合并下拉菜单 -->
    <div class="dropdown" id="importexport-dropdown">
      <button class="btn" id="btn-importexport">📥 导入/导出</button>
      <ul class="dropdown-menu" id="importexport-menu">
        <li id="menu-export">导出 Mark.txt</li>
        <li id="menu-import">导入 Mark.txt</li>
      </ul>
    </div>

    <input type="file" id="file-input" accept=".txt,text/plain" hidden>
  </section>

  <section id="selection-toolbar" class="selection-toolbar hidden">
    <span>已选择 <strong id="selected-count">0</strong> 个</span>
    <button id="btn-mark-all" class="btn btn-small">标记</button>
    <button id="btn-unmark-all" class="btn btn-small">取消标记</button>
    <button id="btn-export-selection" class="btn btn-small">导出所选</button>
    <button id="btn-exit-selection" class="btn btn-small">退出选择</button>
  </section>

  <section class="stats">
    <span>总词数 <strong id="stat-total">0</strong></span>
    <span>当前显示 <strong id="stat-shown">0</strong></span>
    <span>生词 <strong id="stat-marked">0</strong></span>
  </section>

  <main id="cards" class="card-grid"></main>
  <nav id="pagination" class="pagination"></nav>
</div>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button id="modal-close" class="modal-close" aria-label="关闭">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';

  // ---- Storage keys ----
  const LS_MARK = 'ngsl_mark_v3';
  const LS_THEME = 'ngsl_theme';
  const LS_PAGINATION = 'ngsl_pagination_mode';

  // ---- Constants ----
  const VALID_LEVELS = new Set(['A1', 'A2', 'B1', 'B2', 'C1', 'C2']);
  const PAGE_SIZE = 20;

  // ---- Global state ----
  let allData = [];
  let displayData = [];
  let markedRanks = new Set();
  let hasLocalMark = false;
  let currentPage = 1;
  let sortCol = 'rank';
  let sortAsc = true;
  let searchQuery = '';
  let levelFilter = 'all';
  let knownFilter = 'unknown';      // 'unknown' | 'all'
  let paginationEnabled = true;
  let selectionMode = false;
  let randomMode = null;            // null | 'all' | 'unknown'
  let hideWordMode = false;
  let revealedRanks = new Set();    // 用于隐藏单词模式，但点击卡片不再切换，所以这个集合可能不再使用，保留但功能移除
  let rankMap = new Map();
  let wordIndexMap = new Map();
  let loadError = false;

  // ---- DOM refs ----
  const cardsEl = document.getElementById('cards');
  const paginationEl = document.getElementById('pagination');
  const modalOverlay = document.getElementById('modal-overlay');
  const modalBody = document.getElementById('modal-body');
  const modalClose = document.getElementById('modal-close');
  const toastEl = document.getElementById('toast');
  const searchInput = document.getElementById('search-input');
  const fileInput = document.getElementById('file-input');

  // ---- Helper functions ----
  function esc(str) {
    return String(str ?? '').replace(/[&<>"']/g, function (m) {
      switch (m) {
        case '&': return '&amp;';
        case '<': return '&lt;';
        case '>': return '&gt;';
        case '"': return '&quot;';
        case "'": return '&#39;';
        default: return m;
      }
    });
  }
  function escAttr(str) { return esc(str); }

  function showToast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => toastEl.classList.remove('show'), 2000);
  }

  function debounce(fn, ms) {
    let timer;
    return function (...args) {
      clearTimeout(timer);
      timer = setTimeout(() => fn.apply(this, args), ms);
    };
  }

  function toNullableNumber(value) {
    if (value === null || value === undefined || value === '') return null;
    const n = Number(value);
    return Number.isFinite(n) ? n : null;
  }

  function toRankNumber(value) {
    const n = Number(value);
    return Number.isFinite(n) ? n : NaN;
  }

  function normalizeEntryFromObj(obj) {
    const rank = toRankNumber(obj.rank ?? obj.Rank);
    const word = String(obj.word ?? obj.Word ?? '').trim();
    return {
      rank,
      word,
      forms: String(obj.forms ?? obj['Word forms'] ?? ''),
      pron: String(obj.pron ?? obj.Pronunciation ?? ''),
      pos: String(obj.pos ?? obj.POS ?? ''),
      def_zh: String(obj.def_zh ?? obj.Definition_ZH ?? ''),
      def_en: String(obj.def_en ?? obj.Definition_EN ?? ''),
      level: String(obj.level ?? obj.Level ?? '').trim(),
      sfi: toNullableNumber(obj.sfi ?? obj.SFI),
      u_value: toNullableNumber(obj.u_value ?? obj['U Value'])
    };
  }

  function normalizeData(data) {
    if (!Array.isArray(data)) throw new Error('NGSL data is not an array');
    const normalized = [];
    for (let i = 0; i < data.length; i++) {
      const raw = data[i];
      if (!raw || typeof raw !== 'object') {
        console.warn('[NGSL] Invalid entry at index', i, raw);
        continue;
      }
      const entry = normalizeEntryFromObj(raw);
      if (!Number.isFinite(entry.rank)) {
        console.warn('[NGSL] Missing/invalid rank at index', i, raw);
        continue;
      }
      if (!entry.word) {
        console.warn('[NGSL] Missing word at rank', entry.rank);
        continue;
      }
      normalized.push(entry);
    }
    return normalized;
  }

  function normalizeHeader(h) {
    const lower = h.toLowerCase().trim();
    if (lower === 'rank') return 'rank';
    if (lower.includes('word') && lower.includes('form')) return 'forms';
    if (lower.includes('word')) return 'word';
    if (lower.includes('pronunciation')) return 'pron';
    if (lower.includes('pos') || lower.includes('part of speech')) return 'pos';
    if (lower.includes('definition_zh') || lower.includes('definition zh') || lower.includes('chinese')) return 'def_zh';
    if (lower.includes('definition_en') || lower.includes('definition en') || lower.includes('english')) return 'def_en';
    if (lower.includes('level')) return 'level';
    if (lower.includes('sfi')) return 'sfi';
    if (lower.includes('u value') || lower.includes('u_value')) return 'u_value';
    return lower.replace(/[^a-z0-9_]/g, '_');
  }

  function parseCSV(text) {
    if (!text) return [];
    text = text.replace(/^\uFEFF/, '');
    const rows = [];
    let field = '';
    let row = [];
    let inQuotes = false;
    let i = 0;
    const n = text.length;

    while (i < n) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false;
          i++;
          continue;
        }
        field += c;
        i++;
      } else {
        if (c === '"') { inQuotes = true; i++; continue; }
        if (c === ',') { row.push(field); field = ''; i++; continue; }
        if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          i++;
          row.push(field);
          field = '';
          rows.push(row);
          row = [];
          continue;
        }
        field += c;
        i++;
      }
    }

    if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
    if (rows.length && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') rows.pop();
    if (!rows.length) return [];

    const headers = rows[0].map(h => h.trim()).map(normalizeHeader);
    const out = [];
    for (let r = 1; r < rows.length; r++) {
      const cols = rows[r];
      const obj = {};
      for (let c = 0; c < headers.length; c++) {
        obj[headers[c]] = cols[c] ?? '';
      }
      out.push(normalizeEntryFromObj(obj));
    }
    return out;
  }

  function shuffle(array) {
    const a = [...array];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // ---- Data access ----
  function buildRankMap() {
    rankMap = new Map();
    for (const e of allData) {
      if (!rankMap.has(e.rank)) rankMap.set(e.rank, e);
    }
  }

  function buildWordIndex() {
    wordIndexMap = new Map();
    for (const e of allData) {
      wordIndexMap.set(e.word.toLowerCase(), e);
    }
  }

  function getEntryByRank(rank) { return rankMap.get(Number(rank)); }
  function findByWord(word) { return wordIndexMap.get(String(word).trim().toLowerCase()); }

  // ---- Storage ----
  function loadTheme() {
    let saved = null;
    try { saved = localStorage.getItem(LS_THEME); } catch (e) {}
    if (saved === 'dark' || saved === 'light') {
      setTheme(saved);
    } else {
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(prefersDark ? 'dark' : 'light');
    }
  }

  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem(LS_THEME, theme); } catch (e) {}
    const btn = document.getElementById('btn-theme');
    if (btn) btn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }

  function loadPaginationPref() {
    let saved = null;
    try { saved = localStorage.getItem(LS_PAGINATION); } catch (e) {}
    paginationEnabled = saved !== 'unpaginate';
  }

  function loadLocalMark() {
    let raw = null;
    try { raw = localStorage.getItem(LS_MARK); } catch (e) {}
    if (raw === null) {
      hasLocalMark = false;
      markedRanks = new Set();
      return;
    }
    try {
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) throw new Error('mark is not array');
      markedRanks = new Set(arr.filter(n => Number.isInteger(n) && n > 0));
      hasLocalMark = true;
    } catch (e) {
      console.warn('[NGSL] Local Mark parse failed, will reinitialize from NGSL_Unknown.txt:', e);
      markedRanks = new Set();
      hasLocalMark = false;
    }
  }

  function saveMark() {
    try {
      const arr = [...markedRanks].sort((a, b) => a - b);
      localStorage.setItem(LS_MARK, JSON.stringify(arr));
    } catch (e) {
      console.warn('[NGSL] Failed to save Mark:', e);
    }
  }

  // ---- Fetch ----
  async function fetchText(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
    return await res.text();
  }

  async function loadNGSL() {
    try {
      const text = await fetchText('./NGSL.json');
      const data = JSON.parse(text.replace(/^\uFEFF/, ''));
      allData = normalizeData(data);
      console.log('[NGSL] Loaded NGSL.json');
    } catch (jsonError) {
      console.warn('[NGSL] NGSL.json load failed, trying NGSL.csv:', jsonError);
      try {
        const text = await fetchText('./NGSL.csv');
        allData = parseCSV(text);
        console.log('[NGSL] Loaded NGSL.csv');
      } catch (csvError) {
        console.error('[NGSL] NGSL.csv load failed:', csvError);
        allData = [];
        loadError = true;
      }
    }
  }

  async function loadUnknown() {
    try {
      const text = await fetchText('./NGSL_Unknown.txt');
      const words = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const ranks = [];
      for (const word of words) {
        const entry = findByWord(word);
        if (entry) {
          ranks.push(entry.rank);
        } else {
          console.warn('[NGSL] Unknown word not found in NGSL:', word);
        }
      }
      markedRanks = new Set(ranks);
      console.log('[NGSL] Initialized Mark from NGSL_Unknown.txt:', markedRanks.size, 'words');
    } catch (e) {
      console.warn('[NGSL] Failed to load NGSL_Unknown.txt:', e);
      markedRanks = new Set();
    }
  }

  // ---- Validation ----
  function validateData() {
    if (!allData.length) {
      console.error('[NGSL] No valid NGSL entries loaded.');
      return;
    }

    const rankSeen = new Map();
    const duplicates = [];
    const missing = [];
    for (const e of allData) {
      if (!e.word) console.error('[NGSL] Missing word for rank:', e.rank);
      if (rankSeen.has(e.rank)) {
        duplicates.push(e.rank);
      } else {
        rankSeen.set(e.rank, e.word);
      }
    }
    for (let r = 1; r <= 2809; r++) {
      if (!rankSeen.has(r)) missing.push(r);
    }
    if (duplicates.length) console.error('[NGSL] Duplicate ranks detected:', duplicates);
    if (missing.length) {
      console.error(
        '[NGSL] Missing ranks:',
        missing.length > 120 ? missing.slice(0, 120).join(', ') + ` ... and ${missing.length - 120} more` : missing.join(', ')
      );
    }
    if (allData.length !== 2809) {
      console.warn('[NGSL] Expected 2809 words, got', allData.length);
    }

    const stats = { A1: 0, A2: 0, B1: 0, B2: 0, C1: 0, C2: 0, Unknown: 0 };
    const seenInvalidLevels = new Set();
    for (const e of allData) {
      if (VALID_LEVELS.has(e.level)) {
        stats[e.level] = (stats[e.level] || 0) + 1;
      } else {
        stats.Unknown++;
        if (!seenInvalidLevels.has(e.level)) {
          console.warn('[NGSL] Unknown level detected:', e.level);
          seenInvalidLevels.add(e.level);
        }
      }
    }
    console.log('[NGSL] Level statistics:', stats);
  }

  // ---- Derived data ----
  function getPaginateNow() {
    return paginationEnabled && searchQuery === '';
  }

  function getBaseData() {
    let list = allData;

    if (levelFilter !== 'all') {
      list = list.filter(e => e.level === levelFilter);
    }

    if (searchQuery) {
      list = list.filter(e => {
        const hay = `${e.word} ${e.forms} ${e.def_en} ${e.def_zh}`.toLowerCase();
        return hay.includes(searchQuery);
      });
    }

    if (randomMode === 'all') {
      // 全部随机忽略生词筛选
    } else if (randomMode === 'unknown') {
      list = list.filter(e => markedRanks.has(e.rank));
    } else if (knownFilter === 'unknown') {
      list = list.filter(e => markedRanks.has(e.rank));
    }

    return list;
  }

  function getDisplayData() {
    let list = getBaseData();

    if (randomMode === 'all' || randomMode === 'unknown') {
      list = shuffle(list);
    } else {
      list = [...list];
      if (sortCol === 'rank') {
        list.sort((a, b) => sortAsc ? a.rank - b.rank : b.rank - a.rank);
      } else {
        list.sort((a, b) => (a.word.localeCompare(b.word)) * (sortAsc ? 1 : -1));
      }
    }

    return list;
  }

  // ---- Level helpers ----
  function levelLabel(entry) {
    return VALID_LEVELS.has(entry.level) ? entry.level : '?';
  }

  function levelClass(entry) {
    return VALID_LEVELS.has(entry.level) ? `level-${entry.level.toLowerCase()}` : 'level-unknown';
  }

  // ---- Render ----
  function render() {
    if (!allData.length || loadError) {
      renderLoadError();
      return;
    }

    displayData = getDisplayData();
    const totalPages = Math.max(1, Math.ceil(displayData.length / PAGE_SIZE));
    currentPage = Math.min(Math.max(1, currentPage), totalPages);

    const paginateNow = getPaginateNow();
    const pageData = paginateNow
      ? displayData.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE)
      : displayData;

    renderStats();
    renderCards(pageData);
    renderPagination();
    renderToolbarState();
  }

  function renderCards(pageData) {
    if (!pageData.length) {
      cardsEl.innerHTML = `<div class="empty">${selectionMode ? '没有单词可选' : '当前没有符合条件的单词'}</div>`;
      return;
    }

    let html = '';
    for (const entry of pageData) {
      const marked = markedRanks.has(entry.rank);
      const revealed = revealedRanks.has(entry.rank);
      const hiddenWord = hideWordMode && !revealed;
      const level = levelLabel(entry);
      const lvClass = levelClass(entry);
      const def = hideWordMode ? (entry.def_en || entry.def_zh || '—') : '';

      html += `
        <div class="card ${marked ? 'is-marked' : ''}" data-rank="${entry.rank}">
          <div class="card-main">
            <div class="card-word-row">
              ${selectionMode ? `<input type="checkbox" class="card-check" data-rank="${entry.rank}" ${marked ? 'checked' : ''} aria-label="选择 ${escAttr(entry.word)}">` : ''}
              <span class="card-word ${hiddenWord ? 'hidden-word' : ''}">${esc(entry.word)}</span>
              <span class="card-level ${lvClass}">${esc(level)}</span>
            </div>
            <div class="card-def">${esc(def)}</div>
            <div class="card-meta">#${entry.rank}</div>
          </div>
          <button class="card-detail" data-action="detail" aria-label="查看 ${escAttr(entry.word)} 详情">📖</button>
        </div>
      `;
    }
    cardsEl.innerHTML = html;
  }

  function renderStats() {
    const paginateNow = getPaginateNow();
    const totalPages = Math.max(1, Math.ceil(displayData.length / PAGE_SIZE));
    currentPage = Math.min(currentPage, totalPages);
    let visibleCount;
    if (paginateNow) {
      visibleCount = displayData.length === 0
        ? 0
        : Math.min(PAGE_SIZE, Math.max(0, displayData.length - (currentPage - 1) * PAGE_SIZE));
    } else {
      visibleCount = displayData.length;
    }
    document.getElementById('stat-total').textContent = allData.length;
    document.getElementById('stat-shown').textContent = visibleCount;
    document.getElementById('stat-marked').textContent = markedRanks.size;
  }

  function renderPagination() {
    if (!getPaginateNow() || displayData.length <= PAGE_SIZE) {
      paginationEl.innerHTML = '';
      return;
    }
    const totalPages = Math.max(1, Math.ceil(displayData.length / PAGE_SIZE));
    currentPage = Math.min(currentPage, totalPages);
    paginationEl.innerHTML = `
      <button class="page-btn" data-page="prev" ${currentPage === 1 ? 'disabled' : ''}>‹</button>
      <span class="page-info">${currentPage} / ${totalPages}</span>
      <button class="page-btn" data-page="next" ${currentPage === totalPages ? 'disabled' : ''}>›</button>
    `;
  }

  function renderToolbarState() {
    const setActive = (el, on) => el && el.classList.toggle('active', !!on);
    setActive(document.getElementById('btn-filter-unknown'), knownFilter === 'unknown' && randomMode !== 'all');
    setActive(document.getElementById('btn-filter-all'), knownFilter === 'all' && randomMode !== 'all');
    const lv = document.getElementById('level-select');
    if (lv) lv.value = levelFilter;
    setActive(document.getElementById('btn-random-all'), randomMode === 'all');
    setActive(document.getElementById('btn-random-unknown'), randomMode === 'unknown');
    setActive(document.getElementById('btn-hide-word'), hideWordMode);
    setActive(document.getElementById('btn-pagination-toggle'), paginationEnabled);
    const pagBtn = document.getElementById('btn-pagination-toggle');
    if (pagBtn) pagBtn.textContent = paginationEnabled ? '分页：开' : '分页：关';
    setActive(document.getElementById('btn-selection'), selectionMode);
    document.getElementById('selection-toolbar').classList.toggle('hidden', !selectionMode);
    document.getElementById('selected-count').textContent = markedRanks.size;
  }

  function renderLoadError() {
    cardsEl.innerHTML = `
      <div class="load-error">
        <h2>数据加载失败</h2>
        <p>请确认 NGSL.json 或 NGSL.csv 存在于 index.html 同一目录。</p>
        <button id="btn-retry" class="btn">重试</button>
      </div>
    `;
    paginationEl.innerHTML = '';
    document.querySelector('.stats').style.display = 'none';
  }

  // ---- Detail modal ----
  function modalHTML(entry) {
    const levelText = levelLabel(entry);
    const levelExtra = VALID_LEVELS.has(entry.level) ? '' : ` <span style="color:var(--muted);font-size:.75rem;">(原始: ${esc(entry.level)})</span>`;
    // 按照用户指定顺序：Word, POS, Chinese def, Word forms, English def, 然后补充其他
    return `
      <h2 class="modal-word">${esc(entry.word)}</h2>
      <div class="modal-field"><span class="modal-label">POS</span><span class="modal-value">${esc(entry.pos || '—')}</span></div>
      <div class="modal-field"><span class="modal-label">Chinese definition</span><span class="modal-value">${esc(entry.def_zh || '—')}</span></div>
      <div class="modal-field"><span class="modal-label">Word forms</span><span class="modal-value">${esc(entry.forms || '—')}</span></div>
      <div class="modal-field"><span class="modal-label">English definition</span><span class="modal-value">${esc(entry.def_en || '—')}</span></div>
      <!-- 辅助信息 -->
      <div class="modal-field"><span class="modal-label">Pronunciation</span><span class="modal-value pronunciation">${esc(entry.pron || '—')}</span></div>
      <div class="modal-field"><span class="modal-label">Level</span><span class="modal-value level">${esc(levelText)}${levelExtra}</span></div>
      <div class="modal-field"><span class="modal-label">Rank</span><span class="modal-value rank">${esc(entry.rank)}</span></div>
      <div class="modal-field aux"><span class="modal-label">SFI</span><span class="modal-value">${entry.sfi !== null && entry.sfi !== undefined ? esc(entry.sfi) : '—'}</span></div>
      <div class="modal-field aux"><span class="modal-label">U Value</span><span class="modal-value">${entry.u_value !== null && entry.u_value !== undefined ? esc(entry.u_value) : '—'}</span></div>
    `;
  }

  function openModal(entry) {
    modalBody.innerHTML = modalHTML(entry);
    modalOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    modalClose.focus();
  }

  function closeModal() {
    modalOverlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  // ---- State mutators ----
  function setKnownFilter(val) {
    knownFilter = val;
    randomMode = null;
    currentPage = 1;
    render();
  }

  function setSelectionMode(on) {
    selectionMode = on;
    if (on) {
      randomMode = null;
      sortCol = 'rank';
      sortAsc = true;
      currentPage = 1;
    }
    render();
  }

  function startRandom(mode) {
    selectionMode = false;
    randomMode = mode;
    currentPage = 1;
    render();
  }

  function resetSorting() {
    randomMode = null;
    sortCol = 'rank';
    sortAsc = true;
    currentPage = 1;
    render();
  }

  function setMark(rank, on) {
    if (on) markedRanks.add(rank);
    else markedRanks.delete(rank);
    saveMark();
  }

  function changePage(page) {
    const totalPages = Math.max(1, Math.ceil(displayData.length / PAGE_SIZE));
    currentPage = Math.min(Math.max(1, page), totalPages);
    render();
  }

  // ---- Export / Import Mark ----
  function exportMark() {
    if (markedRanks.size === 0) {
      showToast('没有可导出的词');
      return;
    }
    const words = allData
      .filter(e => markedRanks.has(e.rank))
      .sort((a, b) => a.rank - b.rank)
      .map(e => e.word);
    const blob = new Blob([words.join('\n')], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'Mark.txt';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
    showToast('已导出');
  }

  async function importMark(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const words = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const foundRanks = [];
      const notFound = [];
      for (const word of words) {
        const entry = findByWord(word);
        if (entry) foundRanks.push(entry.rank);
        else notFound.push(word);
      }
      if (notFound.length) {
        console.warn('[NGSL] Import words not found in NGSL:', notFound);
      }
      markedRanks = new Set(foundRanks);
      saveMark();
      render();
      showToast(`已导入 ${foundRanks.length} 个生词`);
    } catch (e) {
      console.error('[NGSL] Import failed:', e);
      showToast('导入失败');
    } finally {
      event.target.value = '';
    }
  }

  // ---- 下拉菜单控制 ----
  function toggleDropdown(menuId) {
    const menu = document.getElementById(menuId);
    if (!menu) return;
    // 关闭其他所有菜单
    document.querySelectorAll('.dropdown-menu').forEach(m => {
      if (m.id !== menuId) m.classList.remove('open');
    });
    menu.classList.toggle('open');
  }

  // 点击其他区域关闭下拉
  document.addEventListener('click', function(e) {
    if (!e.target.closest('.dropdown')) {
      document.querySelectorAll('.dropdown-menu').forEach(m => m.classList.remove('open'));
    }
  });

  // ---- Event handling ----
  function handleCardClick(e) {
    // 复选框处理
    const checkbox = e.target.closest('.card-check');
    if (checkbox) {
      const rank = Number(checkbox.dataset.rank);
      setMark(rank, checkbox.checked);
      render();
      return;
    }

    // 详情按钮处理
    const detailBtn = e.target.closest('[data-action="detail"]');
    if (detailBtn) {
      const card = detailBtn.closest('.card');
      if (!card) return;
      const rank = Number(card.dataset.rank);
      const entry = getEntryByRank(rank);
      if (entry) openModal(entry);
      return;
    }

    // 点击卡片其他区域不做任何操作
  }

  // 隐藏单词模式：我们不再通过点击卡片切换reveal，因此移除相关逻辑，但保留revealedRanks集合，仅用于在渲染时判断是否显示（但无法通过点击切换，可以保留但功能不再可用）
  // 用户可以通过再次点击“隐藏单词”按钮切换整个模式的开关，但单个单词的reveal不再支持。为了简化，我们完全移除reveal功能，隐藏单词模式就是全部隐藏或全部显示。
  // 修改：在隐藏单词模式下，所有单词的显示由hideWordMode统一控制，不再需要revealedRanks。
  // 所以我们移除revealedRanks的使用，并修改渲染逻辑。
  // 在renderCards中，原 hiddenWord = hideWordMode && !revealed，改为 hiddenWord = hideWordMode。
  // 同时移除对revealedRanks的维护。
  // 我们不再需要点击切换显示，所以删除相关代码。
  // 但用户说“隐藏单词”模式是背词模式，即隐藏单词显示释义，这仍然通过按钮切换，但不再支持点击单词显示。
  // 如果用户希望点击卡片显示单词，但之前已经取消，所以就这样。

  // 修改renderCards中的隐藏逻辑：
  // 将 hiddenWord = hideWordMode && !revealed 改为 hiddenWord = hideWordMode
  // 并且移除revealedRanks相关操作。
  // 但我们还要保留def的显示，当hideWordMode为true时，显示释义。
  // 因为用户希望隐藏单词时显示释义，所以我们保留card-def显示释义。
  // 好。

  // 重新定义renderCards覆盖原函数
  // 但为了不重复大段代码，我将在最终代码中直接修改。

  // 我们还需要调整卡片点击事件：因为之前还包含了选择模式下的点击切换标记，现在已移除。

  // 然后绑定事件

  function bindEvents() {
    document.getElementById('btn-theme').addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      setTheme(next);
    });

    document.getElementById('btn-filter-unknown').addEventListener('click', () => setKnownFilter('unknown'));
    document.getElementById('btn-filter-all').addEventListener('click', () => setKnownFilter('all'));

    document.getElementById('level-select').addEventListener('change', (e) => {
      levelFilter = e.target.value;
      randomMode = null;
      currentPage = 1;
      render();
    });

    searchInput.addEventListener('input', debounce((e) => {
      searchQuery = e.target.value.trim().toLowerCase();
      currentPage = 1;
      render();
    }, 300));

    document.addEventListener('keydown', (e) => {
      if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) {
        e.preventDefault();
        searchInput.focus();
      }
      if (e.key === 'Escape') {
        closeModal();
      }
    });

    document.getElementById('btn-random-all').addEventListener('click', () => startRandom('all'));
    document.getElementById('btn-random-unknown').addEventListener('click', () => startRandom('unknown'));
    document.getElementById('btn-reset-sort').addEventListener('click', resetSorting);

    document.getElementById('btn-hide-word').addEventListener('click', () => {
      hideWordMode = !hideWordMode;
      // 不再需要清除revealedRanks，因为我们不再使用
      currentPage = 1;
      render();
    });

    document.getElementById('btn-pagination-toggle').addEventListener('click', () => {
      paginationEnabled = !paginationEnabled;
      try {
        localStorage.setItem(LS_PAGINATION, paginationEnabled ? 'paginate' : 'unpaginate');
      } catch (e) {}
      currentPage = 1;
      render();
    });

    document.getElementById('btn-selection').addEventListener('click', () => setSelectionMode(!selectionMode));
    document.getElementById('btn-exit-selection').addEventListener('click', () => setSelectionMode(false));

    document.getElementById('btn-mark-all').addEventListener('click', () => {
      for (const e of displayData) markedRanks.add(e.rank);
      saveMark();
      render();
      showToast('已标记');
    });

    document.getElementById('btn-unmark-all').addEventListener('click', () => {
      for (const e of displayData) markedRanks.delete(e.rank);
      saveMark();
      render();
      showToast('已取消标记');
    });

    // 导出/导入合并菜单
    document.getElementById('btn-importexport').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleDropdown('importexport-menu');
    });
    document.getElementById('menu-export').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('importexport-menu').classList.remove('open');
      exportMark();
    });
    document.getElementById('menu-import').addEventListener('click', (e) => {
      e.stopPropagation();
      document.getElementById('importexport-menu').classList.remove('open');
      fileInput.click();
    });
    fileInput.addEventListener('change', importMark);

    // 单词表下拉菜单
    document.getElementById('btn-wordlist').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleDropdown('wordlist-menu');
    });
    document.getElementById('wordlist-menu').addEventListener('click', (e) => {
      const li = e.target.closest('li');
      if (!li) return;
      const url = li.dataset.url;
      if (url) {
        window.open(url, '_blank');
        document.getElementById('wordlist-menu').classList.remove('open');
      }
    });

    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', (e) => {
      if (e.target === modalOverlay) closeModal();
    });

    cardsEl.addEventListener('click', handleCardClick);

    paginationEl.addEventListener('click', (e) => {
      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.dataset.page === 'prev') changePage(currentPage - 1);
      else if (btn.dataset.page === 'next') changePage(currentPage + 1);
    });

    document.addEventListener('click', (e) => {
      if (e.target.closest('#btn-retry')) window.location.reload();
    });
  }

  // ---- 覆盖renderCards，使用新的隐藏逻辑 ----
  // 由于我们在上面定义了renderCards，但实际运行时会被覆盖，我们直接在脚本末尾重新定义
  // 但我们可以在init之前重新赋值
  const originalRenderCards = renderCards;
  renderCards = function(pageData) {
    if (!pageData.length) {
      cardsEl.innerHTML = `<div class="empty">${selectionMode ? '没有单词可选' : '当前没有符合条件的单词'}</div>`;
      return;
    }

    let html = '';
    for (const entry of pageData) {
      const marked = markedRanks.has(entry.rank);
      const hiddenWord = hideWordMode; // 不再使用revealedRanks
      const level = levelLabel(entry);
      const lvClass = levelClass(entry);
      // 当隐藏单词时，显示释义（如果有）
      const def = hideWordMode ? (entry.def_en || entry.def_zh || '—') : '';

      html += `
        <div class="card ${marked ? 'is-marked' : ''}" data-rank="${entry.rank}">
          <div class="card-main">
            <div class="card-word-row">
              ${selectionMode ? `<input type="checkbox" class="card-check" data-rank="${entry.rank}" ${marked ? 'checked' : ''} aria-label="选择 ${escAttr(entry.word)}">` : ''}
              <span class="card-word ${hiddenWord ? 'hidden-word' : ''}">${esc(entry.word)}</span>
              <span class="card-level ${lvClass}">${esc(level)}</span>
            </div>
            <div class="card-def">${esc(def)}</div>
            <div class="card-meta">#${entry.rank}</div>
          </div>
          <button class="card-detail" data-action="detail" aria-label="查看 ${escAttr(entry.word)} 详情">📖</button>
        </div>
      `;
    }
    cardsEl.innerHTML = html;
  };

  // ---- Init ----
  async function init() {
    loadTheme();
    loadPaginationPref();
    loadLocalMark();

    await loadNGSL();

    if (!allData.length || loadError) {
      renderLoadError();
      bindEvents();
      return;
    }

    buildRankMap();
    buildWordIndex();

    if (!hasLocalMark) {
      await loadUnknown();
      hasLocalMark = true;
      saveMark();
    }

    validateData();
    render();
    bindEvents();

    console.log('[NGSL] NGSL loaded:', allData.length, 'words');
    console.log('[NGSL] Mark loaded:', markedRanks.size, 'words');
  }

  init().catch((e) => {
    console.error('[NGSL] Init failed:', e);
    loadError = true;
    renderLoadError();
    bindEvents();
  });
})();
</script>
</body>
</html>
