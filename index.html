<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>词汇学习工具</title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --text: #1f2328; --muted: #6b7280;
  --border: #e1e4e8; --primary: #4c7dff; --primary-soft: #eef3ff;
  --danger: #d64545; --shadow: 0 8px 24px rgba(0,0,0,.06);
  --modal-bg: rgba(15,18,22,.45); --toast-bg: #1f2328; --toast-text: #f9fafb;
  --dropdown-bg: var(--card); --dropdown-shadow: 0 8px 20px rgba(0,0,0,.12);
}
[data-theme="dark"] {
  --bg: #0f1115; --card: #181c23; --text: #e7eaee; --muted: #8a94a3;
  --border: #2b323d; --primary: #6d95ff; --primary-soft: #1c2434;
  --danger: #ff7b7b; --shadow: 0 8px 24px rgba(0,0,0,.35);
  --modal-bg: rgba(0,0,0,.65); --toast-bg: #2a313c; --toast-text: #fff;
  --dropdown-bg: #1f262f; --dropdown-shadow: 0 8px 20px rgba(0,0,0,.5);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  line-height: 1.5; transition: background .3s ease, color .3s ease;
}
.container { max-width: 1200px; margin: 0 auto; padding: 18px 20px 60px; }

/* header */
header {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 16px;
}
h1 { font-size: 1.4rem; margin: 0; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.icon-btn {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 8px 12px; font-size: 1.15rem; cursor: pointer; color: var(--text);
  transition: border-color .2s ease; line-height: 1;
}
.icon-btn:hover { border-color: var(--primary); }

/* toolbar */
.toolbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; padding: 10px 12px; box-shadow: var(--shadow);
}
.btn {
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  border-radius: 10px; padding: 7px 11px; font-size: .85rem; cursor: pointer;
  transition: background .2s ease, border-color .2s ease, color .2s ease;
  white-space: nowrap;
}
.btn:hover { border-color: var(--primary); }
.btn.active { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); font-weight: 600; }
.btn[hidden] { display: none !important; }
.search {
  border: 1px solid var(--border); background: var(--bg); color: var(--text);
  border-radius: 10px; padding: 7px 10px; font-size: .85rem; outline: none;
  flex: 1 1 180px; min-width: 140px; transition: border-color .2s ease;
}
.search:focus { border-color: var(--primary); }
.toolbar-sep { width: 1px; height: 20px; background: var(--border); margin: 0 2px; }

/* stats */
.stats { display: flex; flex-wrap: wrap; gap: 18px; color: var(--muted); font-size: .82rem; margin: 12px 2px 8px; }
.stats strong { color: var(--text); font-weight: 600; }

/* cards */
.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 10px; margin-top: 12px;
}
.card {
  position: relative; background: var(--card); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.03);
  transition: border-color .2s ease, background .2s ease, transform .1s ease;
  display: flex; align-items: center; gap: 10px; min-height: 56px;
}
.card:hover { border-color: var(--primary); transform: translateY(-1px); }
.card.is-marked { border-color: color-mix(in srgb, var(--primary) 45%, var(--border)); }
.card-check { flex-shrink: 0; width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer; }
.card-word {
  flex: 1; min-width: 0; font-size: 1.3rem; font-weight: 600;
  line-height: 1.3; cursor: pointer; word-break: break-word;
  overflow-wrap: anywhere; transition: color .15s ease;
}
.card-word:hover { color: var(--primary); }

.empty, .load-error {
  grid-column: 1 / -1; text-align: center; color: var(--muted);
  padding: 40px 20px; background: var(--card);
  border: 1px dashed var(--border); border-radius: 16px;
}
.load-error h2 { margin-top: 0; color: var(--danger); }

/* pagination */
.pagination { display: flex; justify-content: center; align-items: center; gap: 12px; margin-top: 18px; }
.page-btn {
  border: 1px solid var(--border); background: var(--card); color: var(--text);
  border-radius: 10px; width: 36px; height: 34px; cursor: pointer;
  font-size: 1.1rem; transition: border-color .2s ease;
}
.page-btn:hover:not(:disabled) { border-color: var(--primary); }
.page-btn:disabled { opacity: .4; cursor: not-allowed; }
.page-info { color: var(--muted); font-size: .85rem; }

/* modal */
.modal-overlay {
  position: fixed; inset: 0; background: var(--modal-bg);
  display: none; align-items: center; justify-content: center;
  padding: 20px; z-index: 50;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--card); color: var(--text);
  border: 1px solid var(--border); border-radius: 20px;
  max-width: 520px; width: 100%; max-height: 85vh; overflow-y: auto;
  padding: 22px; box-shadow: 0 24px 64px rgba(0,0,0,.18); position: relative;
}
.modal-close {
  position: absolute; top: 12px; right: 14px;
  background: transparent; border: 0; color: var(--muted);
  font-size: 1.7rem; cursor: pointer; line-height: 1;
}
.modal-close:hover { color: var(--danger); }
.modal-word { font-size: 2rem; font-weight: 800; margin: 0 0 16px; padding-right: 30px; word-break: break-word; }
.modal-field {
  display: flex; align-items: baseline; gap: 8px;
  padding: 8px 0; border-bottom: 1px solid var(--border); font-size: .92rem;
}
.modal-field:last-child { border-bottom: 0; }
.modal-field.aux { font-size: .8rem; }
.modal-label {
  min-width: 96px; color: var(--muted); font-size: .75rem;
  flex-shrink: 0; font-weight: 600;
}
.modal-value { color: var(--text); word-break: break-word; flex: 1; }
.modal-value.pronunciation { font-style: italic; color: var(--muted); }
.modal-value.multiline { white-space: pre-wrap; }

/* dropdown */
.dropdown { position: relative; display: inline-block; }
.dropdown-menu {
  display: none; position: absolute; top: 110%; right: 0;
  background: var(--dropdown-bg); border: 1px solid var(--border);
  border-radius: 12px; box-shadow: var(--dropdown-shadow);
  min-width: 200px; padding: 6px 0; z-index: 20; list-style: none; margin: 0;
  max-height: 70vh; overflow-y: auto;
}
.dropdown-menu.open { display: block; }
.dropdown-menu li {
  padding: 8px 16px; cursor: pointer; font-size: .87rem;
  white-space: nowrap; color: var(--text); transition: background .15s ease;
}
.dropdown-menu li:hover { background: var(--primary-soft); color: var(--primary); }
.dropdown-menu li.menu-header {
  padding: 8px 16px 4px; font-size: .72rem; color: var(--muted);
  font-weight: 700; letter-spacing: .04em; cursor: default;
}
.dropdown-menu li.menu-header:hover { background: transparent; color: var(--muted); }
.dropdown-menu li.divider {
  border-top: 1px solid var(--border); margin: 4px 8px;
  padding: 0; cursor: default; height: 0;
}
.dropdown-menu li.divider:hover { background: transparent; }

/* toast */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%);
  background: var(--toast-bg); color: var(--toast-text);
  padding: 10px 18px; border-radius: 999px; font-size: .88rem;
  opacity: 0; pointer-events: none;
  transition: opacity .3s ease, transform .3s ease;
  z-index: 100; white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(-4px); }

/* mobile */
@media (max-width: 620px) {
  .container { padding: 12px 12px 48px; }
  h1 { font-size: 1.15rem; }
  .toolbar { gap: 6px; padding: 8px; }
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .card { padding: 10px 12px; min-height: 48px; }
  .card-word { font-size: 1.05rem; line-height: 1.25; }
  .modal { padding: 18px; }
  .modal-word { font-size: 1.5rem; }
  .modal-label { min-width: 76px; }
  .stats { gap: 10px; font-size: .75rem; }
  .toolbar-sep { display: none; }
}
@media (max-width: 400px) {
  .card-grid { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  .card-word { font-size: .98rem; }
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>词汇学习</h1>
    <div class="header-actions">
      <div class="dropdown">
        <button class="icon-btn" id="btn-menu" title="菜单" aria-label="菜单">☰</button>
        <ul class="dropdown-menu" id="menu">
          <li class="menu-header">词表</li>
          <li id="menu-import-wordlist">导入词表…</li>
          <li id="menu-export-wordlist">导出当前词表</li>
          <li class="menu-header">生词</li>
          <li id="menu-import-mark">导入生词…</li>
          <li id="menu-export-mark">导出全部生词</li>
          <li class="divider"></li>
          <li id="menu-pagination">分页：开</li>
          <li id="menu-theme">主题：🌙</li>
          <li class="divider"></li>
          <li class="menu-header">词表资源</li>
          <li data-url="NGSL&Means.html">NGSL 释义</li>
          <li data-url="NGSL1.1网页.html">NGSL 1.1</li>
          <li data-url="Oxford3000_CEFR_level[US].pdf">Oxford 3000 CEFR</li>
          <li data-url="雅思核心词汇4000词[分类].pdf">雅思核心 4000 词</li>
          <li data-url="高考3500词频表.pdf">高考 3500 词</li>
          <li data-url="100个句子3500个高考单词.pdf">100 句 / 3500 高考单词</li>
        </ul>
      </div>
    </div>
  </header>

  <section class="toolbar">
    <button id="btn-view-current" class="btn active">当前词表</button>
    <button id="btn-view-marked" class="btn">生词</button>
    <button id="btn-view-dict" class="btn">词典</button>
    <input id="search-input" class="search" type="search" placeholder="搜索单词 / 释义 / 词形" autocomplete="off">
    <button id="btn-random-all" class="btn">全部随机</button>
    <button id="btn-random-marked" class="btn">生词随机</button>
    <button id="btn-random" class="btn" hidden>随机</button>
    <button id="btn-selection" class="btn">选择</button>
  </section>

  <section class="stats">
    <span>总词数 <strong id="stat-total">0</strong></span>
    <span>当前显示 <strong id="stat-shown">0</strong></span>
    <span>生词 <strong id="stat-marked">0</strong></span>
  </section>

  <main id="cards" class="card-grid"></main>
  <nav id="pagination" class="pagination"></nav>
</div>

<div id="modal-overlay" class="modal-overlay">
  <div class="modal" role="dialog" aria-modal="true">
    <button id="modal-close" class="modal-close" aria-label="关闭">×</button>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast" class="toast"></div>

<input type="file" id="file-import-wordlist" accept=".txt,text/plain" hidden>
<input type="file" id="file-import-mark" accept=".txt,text/plain" hidden>

<script>
(function () {
  'use strict';

  /* ============================================================
   * 文件路径约定
   * ============================================================ */
  const DATA_FILE = './dictionary.csv';       // 主库（2万词）
  const DEFAULT_WORDLIST_FILE = './NGSL.txt'; // 默认当前词表
  const DEFAULT_UNKNOWN_FILE = './NGSL_Unknown.txt';

  /* ============================================================
   * localStorage keys
   * ============================================================ */
  const LS_MARK = 'wordlist_mark_v1';
  const LS_CURRENT_WORDLIST = 'wordlist_current_v1';
  const LS_THEME = 'ngsl_theme';
  const LS_PAGINATION = 'ngsl_pagination_mode';

  const PAGE_SIZE = 20;

  /* ============================================================
   * State
   * ============================================================ */
  let allData = [];             // Dictionary.csv 全部
  let currentList = [];         // 当前词表（默认 NGSL.txt，可被导入替换）
  let displayData = [];         // 当前渲染结果（筛选/搜索/随机之后）
  let markedRanks = new Set();  // 全局 Mark（跨词表）
  let hasLocalMark = false;
  let currentPage = 1;
  let searchQuery = '';
  let viewMode = 'current';     // 'current' | 'marked' | 'dict'
  let randomMode = null;        // null | 'all' | 'marked'
  let selectionMode = false;
  let paginationEnabled = true;
  let shuffledCache = null;     // 随机模式下的稳定快照，翻页不变
  let rankMap = new Map();
  let wordIndexMap = new Map();
  let loadError = false;

  /* ============================================================
   * DOM
   * ============================================================ */
  const cardsEl = document.getElementById('cards');
  const paginationEl = document.getElementById('pagination');
  const modalOverlay = document.getElementById('modal-overlay');
  const modalBody = document.getElementById('modal-body');
  const modalClose = document.getElementById('modal-close');
  const toastEl = document.getElementById('toast');
  const searchInput = document.getElementById('search-input');
  const fileImportWordlist = document.getElementById('file-import-wordlist');
  const fileImportMark = document.getElementById('file-import-mark');

  /* ============================================================
   * Helpers
   * ============================================================ */
  function esc(str) {
    return String(str ?? '').replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    })[m]);
  }
  function escAttr(str) { return esc(str); }

  function showToast(msg) {
    if (!toastEl) return;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(showToast._timer);
    showToast._timer = setTimeout(() => toastEl.classList.remove('show'), 2200);
  }
  function debounce(fn, ms) {
    let t;
    return function (...args) {
      clearTimeout(t);
      t = setTimeout(() => fn.apply(this, args), ms);
    };
  }
  function toRankNumber(v) {
    const n = Number(v);
    return Number.isFinite(n) ? n : NaN;
  }
  function cleanValue(v) {
    if (v === null || v === undefined) return '';
    let s = String(v).trim();
    if (s === '' || s === 'nullTag' || s === 'NULL' || s === 'null') return '';
    return s.replace(/\\r\\n/g, '\n').replace(/\\n/g, '\n').replace(/\\r/g, '\n').trim();
  }

  /* ============================================================
   * Normalization
   * ============================================================ */
  function normalizeEntryFromObj(obj) {
    const rank = toRankNumber(
      obj.rank ?? obj.Rank ?? obj.wordID ?? obj.wordId ?? obj['Word ID']
    );
    const word = String(
      obj.word ?? obj.Word ?? obj.wordContent ?? obj['Word Content'] ?? ''
    ).trim();
    return {
      rank,
      word,
      forms:  cleanValue(obj.forms ?? obj['Word forms'] ?? obj.wordExchanges ?? obj['wordExchanges']),
      pron:   cleanValue(obj.pron  ?? obj.Pronunciation ?? obj.phonetic_US ?? obj['phonetic_US']),
      def_zh: cleanValue(obj.def_zh ?? obj.Definition_ZH ?? obj.translation ?? obj['translation']),
      def_en: cleanValue(obj.def_en ?? obj.Definition_EN ?? obj.definition  ?? obj['definition']),
      tags:   cleanValue(obj.tags   ?? obj.wordTags ?? obj['wordTags'] ?? obj.level ?? obj.Level)
    };
  }
  function normalizeData(data) {
    if (!Array.isArray(data)) throw new Error('data is not an array');
    const out = [];
    for (const raw of data) {
      if (!raw || typeof raw !== 'object') continue;
      const e = normalizeEntryFromObj(raw);
      if (!Number.isFinite(e.rank)) continue;
      if (!e.word) continue;
      out.push(e);
    }
    return out;
  }
  function normalizeHeader(h) {
    const lower = h.toLowerCase().trim();
    if (lower === 'rank') return 'rank';
    if (lower === 'wordid' || lower === 'word_id' || lower === 'id') return 'rank';
    if (lower === 'wordcontent' || lower === 'word_content') return 'word';
    if (lower === 'word') return 'word';
    if (lower.includes('exchange') || lower.includes('word form') || lower === 'forms') return 'forms';
    if (lower.includes('phonetic') || lower.includes('pronunciation') || lower === 'pron') return 'pron';
    if (lower === 'pos' || lower.includes('part of speech')) return 'pos';
    if (lower.includes('translation') || lower.includes('definition_zh') || lower.includes('definition zh')) return 'def_zh';
    if (lower.includes('definition')) return 'def_en';
    if (lower.includes('tag') || lower.includes('level')) return 'tags';
    return lower.replace(/[^a-z0-9_]/g, '_');
  }

  /* 标准 CSV（引号、"" 转义、字段内换行、BOM） */
  function parseCSV(text) {
    if (!text) return [];
    text = text.replace(/^\uFEFF/, '');
    const rows = [];
    let field = '', row = [], inQuotes = false, i = 0;
    const n = text.length;
    while (i < n) {
      const c = text[i];
      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++;
      } else {
        if (c === '"') { inQuotes = true; i++; continue; }
        if (c === ',') { row.push(field); field = ''; i++; continue; }
        if (c === '\n' || c === '\r') {
          if (c === '\r' && text[i + 1] === '\n') i++;
          i++;
          row.push(field); field = '';
          rows.push(row); row = [];
          continue;
        }
        field += c; i++;
      }
    }
    if (field !== '' || row.length > 0) { row.push(field); rows.push(row); }
    if (rows.length && rows[rows.length - 1].length === 1 && rows[rows.length - 1][0] === '') rows.pop();
    if (!rows.length) return [];
    const headers = rows[0].map(h => h.trim()).map(normalizeHeader);
    const out = [];
    for (let r = 1; r < rows.length; r++) {
      const cols = rows[r];
      const obj = {};
      for (let c = 0; c < headers.length; c++) obj[headers[c]] = cols[c] ?? '';
      out.push(normalizeEntryFromObj(obj));
    }
    return out;
  }

  function shuffle(array) {
    const a = [...array];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ============================================================
   * Indexes
   * ============================================================ */
  function buildRankMap() {
    rankMap = new Map();
    for (const e of allData) if (!rankMap.has(e.rank)) rankMap.set(e.rank, e);
  }
  function buildWordIndex() {
    wordIndexMap = new Map();
    for (const e of allData) wordIndexMap.set(e.word.toLowerCase(), e);
  }
  function getEntryByRank(rank) { return rankMap.get(Number(rank)); }
  function findByWord(word) { return wordIndexMap.get(String(word).trim().toLowerCase()); }

  /* ============================================================
   * Storage
   * ============================================================ */
  function loadTheme() {
    let saved = null;
    try { saved = localStorage.getItem(LS_THEME); } catch (e) {}
    if (saved === 'dark' || saved === 'light') setTheme(saved);
    else {
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      setTheme(prefersDark ? 'dark' : 'light');
    }
  }
  function setTheme(theme) {
    document.documentElement.dataset.theme = theme;
    try { localStorage.setItem(LS_THEME, theme); } catch (e) {}
    updateMenuState();
  }
  function loadPaginationPref() {
    let saved = null;
    try { saved = localStorage.getItem(LS_PAGINATION); } catch (e) {}
    paginationEnabled = saved !== 'unpaginate';
  }
  function loadLocalMark() {
    let raw = null;
    try { raw = localStorage.getItem(LS_MARK); } catch (e) {}
    if (raw === null) { hasLocalMark = false; markedRanks = new Set(); return; }
    try {
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) throw new Error('not array');
      markedRanks = new Set(arr.filter(n => Number.isFinite(n) && n > 0));
      hasLocalMark = true;
    } catch (e) {
      console.warn('[Wordlist] Mark parse failed:', e);
      markedRanks = new Set();
      hasLocalMark = false;
    }
  }
  function saveMark() {
    try { localStorage.setItem(LS_MARK, JSON.stringify([...markedRanks].sort((a, b) => a - b))); }
    catch (e) { console.warn('[Wordlist] saveMark failed:', e); }
  }
  function loadStoredWordlist() {
    try {
      const raw = localStorage.getItem(LS_CURRENT_WORDLIST);
      if (!raw) return null;
      const arr = JSON.parse(raw);
      if (!Array.isArray(arr)) return null;
      return arr;
    } catch (e) { return null; }
  }
  function saveStoredWordlist() {
    try {
      localStorage.setItem(LS_CURRENT_WORDLIST, JSON.stringify(currentList.map(e => e.word)));
    } catch (e) { console.warn('[Wordlist] saveStoredWordlist failed:', e); }
  }

  /* ============================================================
   * Fetch
   * ============================================================ */
  async function fetchText(url) {
    const res = await fetch(url, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status} for ${url}`);
    return await res.text();
  }

  /* ============================================================
   * Loading
   * ============================================================ */
  async function loadMainData() {
    try {
      const text = await fetchText(DATA_FILE);
      if (text.trim().startsWith('[')) allData = normalizeData(JSON.parse(text.replace(/^\uFEFF/, '')));
      else allData = parseCSV(text);
      console.log('[Wordlist] Main data loaded:', allData.length, 'entries from', DATA_FILE);
    } catch (e) {
      console.error('[Wordlist] Main data load failed:', e);
      allData = [];
      loadError = true;
    }
  }

  /* 把一批 word 转成 entry 数组（保持 txt 顺序，匹配 Dictionary） */
  function wordsToEntries(words) {
    const list = [];
    const notFound = [];
    for (const w of words) {
      const entry = findByWord(w);
      if (entry) list.push(entry);
      else notFound.push(w);
    }
    return { list, notFound };
  }

  async function loadDefaultWordlist() {
    // 优先用 localStorage 里持久化的（用户导入过的）
    const stored = loadStoredWordlist();
    if (stored && stored.length) {
      const { list, notFound } = wordsToEntries(stored);
      if (list.length) {
        currentList = list;
        console.log('[Wordlist] Current wordlist restored from localStorage:', currentList.length,
          notFound.length ? `(${notFound.length} not found)` : '');
        return;
      }
    }
    // 否则加载 NGSL.txt
    try {
      const text = await fetchText(DEFAULT_WORDLIST_FILE);
      const words = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const { list, notFound } = wordsToEntries(words);
      if (notFound.length) {
        console.warn('[Wordlist] Default wordlist — not in Dictionary.csv:',
          notFound.slice(0, 30), notFound.length > 30 ? `... +${notFound.length - 30}` : '');
      }
      currentList = list;
      console.log('[Wordlist] Default wordlist loaded:', currentList.length, 'entries from', DEFAULT_WORDLIST_FILE);
    } catch (e) {
      console.error('[Wordlist]', DEFAULT_WORDLIST_FILE, 'load failed:', e);
      currentList = allData;  // 兜底
      showToast('默认词表加载失败，已显示全部词库');
    }
  }

  async function loadUnknown() {
    try {
      const text = await fetchText(DEFAULT_UNKNOWN_FILE);
      const words = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      const ranks = [];
      for (const w of words) {
        const entry = findByWord(w);
        if (entry) ranks.push(entry.rank);
        else console.warn('[Wordlist] Unknown word not found:', w);
      }
      markedRanks = new Set(ranks);
      console.log('[Wordlist] Mark initialized from', DEFAULT_UNKNOWN_FILE, ':', markedRanks.size);
    } catch (e) {
      console.warn('[Wordlist]', DEFAULT_UNKNOWN_FILE, 'unavailable, marking current list as unknown');
      markedRanks = new Set(currentList.map(e => e.rank));
      showToast('默认生词列表加载失败，已将所有词标记为生词');
    }
  }

  function validateData() {
    if (!allData.length) { console.error('[Wordlist] No valid entries.'); return; }
    const seen = new Map();
    const dups = [];
    for (const e of allData) {
      if (seen.has(e.rank)) dups.push(e.rank);
      else seen.set(e.rank, e.word);
    }
    if (dups.length) console.error('[Wordlist] Duplicate IDs:', dups.slice(0, 20), dups.length > 20 ? `+${dups.length - 20}` : '');
  }

  /* ============================================================
   * Derived
   * ============================================================ */
  function getPaginateNow() {
    // 词典视图强制分页，避免 2 万词一次性渲染
    if (viewMode === 'dict') return true;
    return paginationEnabled && searchQuery === '';
  }

  function buildSourceList() {
    if (viewMode === 'current') return currentList;
    if (viewMode === 'marked') return allData.filter(e => markedRanks.has(e.rank));
    if (viewMode === 'dict') return allData;
    return [];
  }

  function clearShuffledCache() { shuffledCache = null; }

  function getDisplayData() {
    let list = buildSourceList();

    // 搜索
    if (searchQuery) {
      list = list.filter(e => {
        const hay = `${e.word} ${e.forms} ${e.def_en} ${e.def_zh}`.toLowerCase();
        return hay.includes(searchQuery);
      });
    } else if (viewMode === 'dict') {
      // 词典视图无搜索词 → 显示空，提示用户输入
      return [];
    }

    // 随机
    if (randomMode === 'marked' && viewMode === 'current') {
      list = list.filter(e => markedRanks.has(e.rank));
    }
    if (randomMode) {
      if (!shuffledCache) shuffledCache = shuffle(list);
      return shuffledCache;
    }
    return list;
  }

  /* ============================================================
   * Render
   * ============================================================ */
  function render() {
    if (!allData.length || loadError) { renderLoadError(); return; }

    displayData = getDisplayData();
    const totalPages = Math.max(1, Math.ceil(displayData.length / PAGE_SIZE));
    currentPage = Math.min(Math.max(1, currentPage), totalPages);

    const paginateNow = getPaginateNow();
    const pageData = paginateNow
      ? displayData.slice((currentPage - 1) * PAGE_SIZE, currentPage * PAGE_SIZE)
      : displayData;

    renderStats();
    renderCards(pageData);
    renderPagination();
    renderToolbarState();
  }

  function shouldShowCheckbox() {
    if (viewMode === 'marked') return true;
    if (viewMode === 'current' && selectionMode) return true;
    return false;
  }

  function renderCards(pageData) {
    if (!pageData.length) {
      let msg;
      if (viewMode === 'dict' && !searchQuery) msg = '输入关键词搜索词典';
      else if (viewMode === 'marked') msg = '还没有生词';
      else if (viewMode === 'dict') msg = '没有匹配的单词';
      else if (selectionMode) msg = '没有单词可选';
      else msg = '当前没有符合条件的单词';
      cardsEl.innerHTML = `<div class="empty">${esc(msg)}</div>`;
      return;
    }
    const showCheck = shouldShowCheckbox();
    let html = '';
    for (const entry of pageData) {
      const marked = markedRanks.has(entry.rank);
      html += `
        <div class="card ${marked ? 'is-marked' : ''}" data-rank="${entry.rank}">
          ${showCheck ? `<input type="checkbox" class="card-check" data-rank="${entry.rank}" ${marked ? 'checked' : ''} aria-label="${escAttr(entry.word)}">` : ''}
          <span class="card-word">${esc(entry.word)}</span>
        </div>`;
    }
    cardsEl.innerHTML = html;
  }

  function renderStats() {
    let totalCount, markCount;
    if (viewMode === 'current') {
      totalCount = currentList.length;
      markCount = 0;
      for (const e of currentList) if (markedRanks.has(e.rank)) markCount++;
    } else if (viewMode === 'marked') {
      totalCount = markedRanks.size;
      markCount = markedRanks.size;
    } else {
      totalCount = allData.length;
      markCount = markedRanks.size;
    }
    document.getElementById('stat-total').textContent = totalCount;
    document.getElementById('stat-shown').textContent = displayData.length;
    document.getElementById('stat-marked').textContent = markCount;
  }

  function renderPagination() {
    if (!getPaginateNow() || displayData.length <= PAGE_SIZE) { paginationEl.innerHTML = ''; return; }
    const totalPages = Math.max(1, Math.ceil(displayData.length / PAGE_SIZE));
    currentPage = Math.min(currentPage, totalPages);
    paginationEl.innerHTML = `
      <button class="page-btn" data-page="prev" ${currentPage === 1 ? 'disabled' : ''}>‹</button>
      <span class="page-info">${currentPage} / ${totalPages}</span>
      <button class="page-btn" data-page="next" ${currentPage === totalPages ? 'disabled' : ''}>›</button>`;
  }

  function renderToolbarState() {
    const isCurrent = viewMode === 'current';
    const isMarked = viewMode === 'marked';
    const isDict = viewMode === 'dict';

    document.getElementById('btn-view-current').classList.toggle('active', isCurrent);
    document.getElementById('btn-view-marked').classList.toggle('active', isMarked);
    document.getElementById('btn-view-dict').classList.toggle('active', isDict);

    const btnRandomAll = document.getElementById('btn-random-all');
    const btnRandomMarked = document.getElementById('btn-random-marked');
    const btnRandom = document.getElementById('btn-random');
    const btnSelection = document.getElementById('btn-selection');

    btnRandomAll.hidden = !isCurrent;
    btnRandomMarked.hidden = !isCurrent;
    btnRandom.hidden = !isMarked;
    btnSelection.hidden = !isCurrent;

    btnRandomAll.classList.toggle('active', isCurrent && randomMode === 'all');
    btnRandomMarked.classList.toggle('active', isCurrent && randomMode === 'marked');
    btnRandom.classList.toggle('active', isMarked && randomMode === 'all');
    btnSelection.classList.toggle('active', isCurrent && selectionMode);

    btnSelection.textContent = selectionMode ? '退出选择' : '选择';

    updateMenuState();
  }

  function updateMenuState() {
    const pag = document.getElementById('menu-pagination');
    if (pag) pag.textContent = '分页：' + (paginationEnabled ? '开' : '关');
    const theme = document.getElementById('menu-theme');
    if (theme) theme.textContent = '主题：' + (document.documentElement.dataset.theme === 'dark' ? '☀️' : '🌙');
  }

  function updateStatsOnly() {
    // 勾/取消时不重渲染卡片，只刷新统计数字
    let totalCount, markCount;
    if (viewMode === 'current') {
      totalCount = currentList.length;
      markCount = 0;
      for (const e of currentList) if (markedRanks.has(e.rank)) markCount++;
    } else if (viewMode === 'marked') {
      totalCount = markedRanks.size;
      markCount = markedRanks.size;
    } else {
      totalCount = allData.length;
      markCount = markedRanks.size;
    }
    document.getElementById('stat-total').textContent = totalCount;
    document.getElementById('stat-marked').textContent = markCount;
    // stat-shown 保持当前渲染时的值
  }

  function renderLoadError() {
    cardsEl.innerHTML = `
      <div class="load-error">
        <h2>数据加载失败</h2>
        <p>请确认 dictionary.csv 与 index.html 同一目录。</p>
        <button id="btn-retry" class="btn">重试</button>
      </div>`;
    paginationEl.innerHTML = '';
    document.querySelector('.stats').style.display = 'none';
  }

  /* ============================================================
   * Modal
   * ============================================================ */
  function modalHTML(entry) {
    const parts = [`<h2 class="modal-word">${esc(entry.word)}</h2>`];
    if (entry.def_zh) parts.push(`<div class="modal-field"><span class="modal-label">中文释义</span><div class="modal-value multiline">${esc(entry.def_zh)}</div></div>`);
    if (entry.forms)  parts.push(`<div class="modal-field"><span class="modal-label">词形变化</span><div class="modal-value">${esc(entry.forms)}</div></div>`);
    if (entry.def_en) parts.push(`<div class="modal-field"><span class="modal-label">English</span><div class="modal-value multiline">${esc(entry.def_en)}</div></div>`);
    if (entry.pron)   parts.push(`<div class="modal-field"><span class="modal-label">发音</span><div class="modal-value pronunciation">${esc(entry.pron)}</div></div>`);
    if (entry.tags)   parts.push(`<div class="modal-field aux"><span class="modal-label">标签</span><div class="modal-value">${esc(entry.tags)}</div></div>`);
    return parts.join('');
  }
  function openModal(entry) {
    modalBody.innerHTML = modalHTML(entry);
    modalOverlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    modalClose.focus();
  }
  function closeModal() {
    modalOverlay.classList.remove('open');
    document.body.style.overflow = '';
  }

  /* ============================================================
   * Mutators
   * ============================================================ */
  function setViewMode(mode) {
    if (mode === viewMode) return;
    viewMode = mode;
    randomMode = null;
    selectionMode = false;
    currentPage = 1;
    clearShuffledCache();
    render();
  }

  function toggleRandom(mode) {
    if (randomMode === mode) randomMode = null;
    else randomMode = mode;
    clearShuffledCache();
    currentPage = 1;
    render();
  }

  function toggleSelection() {
    selectionMode = !selectionMode;
    render();
  }

  function setMark(rank, on) {
    if (on) markedRanks.add(rank);
    else markedRanks.delete(rank);
    saveMark();
  }

  function changePage(page) {
    const totalPages = Math.max(1, Math.ceil(displayData.length / PAGE_SIZE));
    currentPage = Math.min(Math.max(1, page), totalPages);
    render();
  }

  /* ============================================================
   * Import / Export
   * ============================================================ */
  function downloadText(text, filename) {
    const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  async function handleImportWordlist(file) {
    try {
      const text = await file.text();
      const words = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if (!words.length) { showToast('文件为空'); return; }
      const { list, notFound } = wordsToEntries(words);
      if (!list.length) {
        showToast(`导入失败：${words.length} 个词都没匹配到`);
        return;
      }
      if (notFound.length) console.warn('[Wordlist] Wordlist import — not found:', notFound.slice(0, 30));
      currentList = list;
      saveStoredWordlist();
      currentPage = 1;
      randomMode = null;
      selectionMode = false;
      clearShuffledCache();
      render();
      showToast(`已导入词表 ${list.length} 个词` + (notFound.length ? `（${notFound.length} 个找不到）` : ''));
    } catch (e) {
      console.error('[Wordlist] Import wordlist failed:', e);
      showToast('导入词表失败');
    }
  }

  function exportCurrentWordlist() {
    if (!currentList.length) { showToast('当前词表为空'); return; }
    downloadText(currentList.map(e => e.word).join('\n'), 'wordlist.txt');
    showToast('已导出当前词表');
  }

  async function handleImportMark(file) {
    try {
      const text = await file.text();
      const words = text.split(/\r?\n/).map(s => s.trim()).filter(Boolean);
      if (!words.length) { showToast('文件为空'); return; }
      const ranks = [];
      const notFound = [];
      for (const w of words) {
        const entry = findByWord(w);
        if (entry) ranks.push(entry.rank);
        else notFound.push(w);
      }
      if (notFound.length) console.warn('[Wordlist] Mark import — not found:', notFound.slice(0, 30));
      markedRanks = new Set(ranks);
      saveMark();
      clearShuffledCache();
      render();
      showToast(`已导入 ${ranks.length} 个生词` + (notFound.length ? `（${notFound.length} 个找不到）` : ''));
    } catch (e) {
      console.error('[Wordlist] Import mark failed:', e);
      showToast('导入生词失败');
    }
  }

  function exportAllMark() {
    if (!markedRanks.size) { showToast('没有生词'); return; }
    const words = allData
      .filter(e => markedRanks.has(e.rank))
      .sort((a, b) => a.rank - b.rank)
      .map(e => e.word);
    downloadText(words.join('\n'), 'mark.txt');
    showToast(`已导出 ${words.length} 个生词`);
  }

  /* ============================================================
   * Dropdown
   * ============================================================ */
  function toggleMenu() {
    const menu = document.getElementById('menu');
    if (menu) menu.classList.toggle('open');
  }
  function closeMenu() {
    const menu = document.getElementById('menu');
    if (menu) menu.classList.remove('open');
  }
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.dropdown')) closeMenu();
  });

  /* ============================================================
   * Card click
   * ============================================================ */
  function handleCardClick(e) {
    const checkbox = e.target.closest('.card-check');
    if (checkbox) {
      e.stopPropagation();
      setMark(Number(checkbox.dataset.rank), checkbox.checked);
      updateStatsOnly();
      return;
    }
    const wordEl = e.target.closest('.card-word');
    if (wordEl) {
      const card = wordEl.closest('.card');
      if (!card) return;
      const entry = getEntryByRank(Number(card.dataset.rank));
      if (entry) openModal(entry);
    }
  }

  /* ============================================================
   * Bind events
   * ============================================================ */
  function bindEvents() {
    document.getElementById('btn-view-current').addEventListener('click', () => setViewMode('current'));
    document.getElementById('btn-view-marked').addEventListener('click', () => setViewMode('marked'));
    document.getElementById('btn-view-dict').addEventListener('click', () => setViewMode('dict'));

    document.getElementById('btn-random-all').addEventListener('click', () => toggleRandom('all'));
    document.getElementById('btn-random-marked').addEventListener('click', () => toggleRandom('marked'));
    document.getElementById('btn-random').addEventListener('click', () => toggleRandom('all'));
    document.getElementById('btn-selection').addEventListener('click', toggleSelection);

    searchInput.addEventListener('input', debounce(e => {
      searchQuery = e.target.value.trim().toLowerCase();
      currentPage = 1;
      clearShuffledCache();
      render();
    }, 300));

    document.addEventListener('keydown', e => {
      if (e.key === '/' && !/input|textarea|select/i.test(document.activeElement.tagName)) {
        e.preventDefault(); searchInput.focus();
      }
      if (e.key === 'Escape') { closeModal(); closeMenu(); }
    });

    // 菜单
    document.getElementById('btn-menu').addEventListener('click', (e) => {
      e.stopPropagation();
      toggleMenu();
    });

    document.getElementById('menu-import-wordlist').addEventListener('click', () => {
      closeMenu();
      fileImportWordlist.click();
    });
    document.getElementById('menu-export-wordlist').addEventListener('click', () => {
      closeMenu();
      exportCurrentWordlist();
    });
    document.getElementById('menu-import-mark').addEventListener('click', () => {
      closeMenu();
      fileImportMark.click();
    });
    document.getElementById('menu-export-mark').addEventListener('click', () => {
      closeMenu();
      exportAllMark();
    });
    document.getElementById('menu-pagination').addEventListener('click', () => {
      paginationEnabled = !paginationEnabled;
      try { localStorage.setItem(LS_PAGINATION, paginationEnabled ? 'paginate' : 'unpaginate'); } catch (e) {}
      currentPage = 1;
      updateMenuState();
      render();
    });
    document.getElementById('menu-theme').addEventListener('click', () => {
      setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
    document.getElementById('menu').addEventListener('click', (e) => {
      const li = e.target.closest('li');
      if (!li) return;
      const url = li.dataset.url;
      if (url) {
        window.open(url, '_blank');
        closeMenu();
      }
    });

    fileImportWordlist.addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) await handleImportWordlist(f);
      e.target.value = '';
    });
    fileImportMark.addEventListener('change', async (e) => {
      const f = e.target.files && e.target.files[0];
      if (f) await handleImportMark(f);
      e.target.value = '';
    });

    modalClose.addEventListener('click', closeModal);
    modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });

    cardsEl.addEventListener('click', handleCardClick);

    paginationEl.addEventListener('click', e => {
      const btn = e.target.closest('button');
      if (!btn) return;
      if (btn.dataset.page === 'prev') changePage(currentPage - 1);
      else if (btn.dataset.page === 'next') changePage(currentPage + 1);
    });

    document.addEventListener('click', e => {
      if (e.target.closest('#btn-retry')) window.location.reload();
    });
  }

  /* ============================================================
   * Init
   * ============================================================ */
  async function init() {
    loadTheme();
    loadPaginationPref();
    loadLocalMark();

    await loadMainData();
    if (!allData.length || loadError) { renderLoadError(); bindEvents(); return; }

    buildWordIndex();
    buildRankMap();

    await loadDefaultWordlist();

    if (!hasLocalMark) {
      await loadUnknown();
      hasLocalMark = true;
      saveMark();
    }

    validateData();
    render();
    bindEvents();

    console.log('[Wordlist] Ready. Main:', allData.length,
      '| Wordlist:', currentList.length, '| Mark:', markedRanks.size);
  }

  init().catch(e => {
    console.error('[Wordlist] Init failed:', e);
    loadError = true;
    renderLoadError();
    bindEvents();
  });
})();
</script>
</body>
</html>
