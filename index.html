<html>
<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NGSL 1.2 词汇学习工具</title>
    <style>
        :root {
            --transition: 0.3s ease;
        }

        html[data-theme="light"] {
            --bg: #f7f8fa;
            --card: #ffffff;
            --text: #1a1a1a;
            --muted: #6b7280;
            --border: #e5e7eb;
            --primary: #2563eb;
            --primary-bg: #eff6ff;
            --hover: #f3f4f6;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            --level-a1: #7aa874;
            --level-a2: #5f9ea0;
            --level-b1: #b5a642;
            --level-b2: #b8860b;
            --level-c1: #9b6b9b;
            --level-c2: #7b5e7b;
            --unknown: #9ca3af;
        }

        html[data-theme="dark"] {
            --bg: #111827;
            --card: #1f2937;
            --text: #f9fafb;
            --muted: #9ca3af;
            --border: #374151;
            --primary: #60a5fa;
            --primary-bg: #1e3a5f;
            --hover: #374151;
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
            --level-a1: #8bc38b;
            --level-a2: #7fbfbf;
            --level-b1: #d4c44a;
            --level-b2: #d4a72c;
            --level-c1: #c291c2;
            --level-c2: #a67fa6;
            --unknown: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            transition: background var(--transition), color var(--transition);
            min-height: 100vh;
        }

        button {
            font-family: inherit;
            cursor: pointer;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 14px;
            transition: background var(--transition), border-color var(--transition), color var(--transition);
        }

        button:hover {
            background: var(--hover);
        }

        button.active {
            background: var(--primary-bg);
            border-color: var(--primary);
            color: var(--primary);
        }

        .hidden {
            display: none !important;
        }

        .toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
            background: var(--bg);
            border-bottom: 1px solid var(--border);
            padding: 12px 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
            transition: background var(--transition), border-color var(--transition);
        }

        .toolbar h1 {
            font-size: 20px;
            font-weight: 700;
            margin-right: 8px;
        }

        .toolbar-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            transition: background var(--transition), border-color var(--transition);
        }

        .search-box {
            flex: 1;
            min-width: 200px;
        }

        .search-box input {
            width: 100%;
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: background var(--transition), border-color var(--transition), color var(--transition);
        }

        .search-box input:focus {
            border-color: var(--primary);
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .filters select {
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--card);
            color: var(--text);
            font-size: 14px;
            outline: none;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition), color var(--transition);
        }

        .segmented {
            display: inline-flex;
            border: 1px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .segmented button {
            border: none;
            border-radius: 0;
            background: var(--card);
            padding: 8px 12px;
        }

        .segmented button:not(:last-child) {
            border-right: 1px solid var(--border);
        }

        .segmented button.active {
            background: var(--primary-bg);
            color: var(--primary);
        }

        .selection-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            width: 100%;
            padding-top: 8px;
        }

        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: center;
            padding: 8px 16px;
            font-size: 13px;
            color: var(--muted);
            border-bottom: 1px solid var(--border);
            background: var(--bg);
            transition: background var(--transition), border-color var(--transition);
        }

        .word-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 12px;
            padding: 16px;
        }

        .word-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            cursor: pointer;
            transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
        }

        .word-card:hover {
            box-shadow: var(--shadow);
            border-color: var(--primary);
        }

        .card-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }

        .mark-label {
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        .mark-check {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: var(--primary);
        }

        .rank {
            font-size: 12px;
            color: var(--muted);
            user-select: none;
        }

        .detail-btn {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 18px;
            line-height: 1;
            padding: 0;
            cursor: pointer;
        }

        .word-wrap {
            flex: 1;
        }

        .word-main {
            font-size: 26px;
            font-weight: 700;
            line-height: 1.2;
            word-break: break-word;
        }

        .word-card:not(.revealed) .word-main.word-hidden {
            display: none;
        }

        .def-main {
            font-size: 15px;
            color: var(--muted);
            line-height: 1.4;
        }

        .def-main .def-en {
            font-weight: 500;
        }

        .def-main .def-zh {
            margin-top: 4px;
        }

        .card-bottom {
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .level {
            font-size: 12px;
            color: var(--muted);
            user-select: none;
        }

        .level-a1 { color: var(--level-a1); }
        .level-a2 { color: var(--level-a2); }
        .level-b1 { color: var(--level-b1); }
        .level-b2 { color: var(--level-b2); }
        .level-c1 { color: var(--level-c1); }
        .level-c2 { color: var(--level-c2); }
        .level-unknown { color: var(--unknown); }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            padding: 16px;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--text);
            color: var(--bg);
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease, transform 0.3s ease;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(-4px);
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .modal-backdrop {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            cursor: pointer;
        }

        .modal-content {
            position: relative;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            width: min(92vw, 480px);
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
            z-index: 1;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .modal-word {
            font-size: 28px;
            font-weight: 700;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 26px;
            cursor: pointer;
            color: var(--muted);
            line-height: 1;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .detail-row {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 8px;
            font-size: 15px;
        }

        .detail-label {
            color: var(--muted);
            font-weight: 500;
        }

        @media (max-width: 640px) {
            .toolbar {
                padding: 10px;
            }
            .controls {
                padding: 10px;
            }
            .word-grid {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
                gap: 8px;
                padding: 10px;
            }
            .word-main {
                font-size: 20px;
            }
            .detail-row {
                grid-template-columns: 110px 1fr;
            }
        }
    </style>
</head>
<body>
    <header class="toolbar">
        <h1>NGSL 1.2</h1>
        <div class="toolbar-group">
            <button id="btnTheme" title="切换主题">🌙</button>
            <button id="btnSelectMode">选择</button>
            <button id="btnRandomAll">全部随机</button>
            <button id="btnRandomUnknown">生词随机</button>
            <button id="btnResetSort">重置排序</button>
            <button id="btnReverse">反转</button>
            <button id="btnPagination">分页</button>
            <button id="btnExportMarkGlobal">导出 Mark</button>
            <label for="importFile" class="btn" style="cursor:pointer; border:1px solid var(--border); border-radius:8px; padding:8px 12px; font-size:14px;">导入 Mark</label>
            <input type="file" id="importFile" accept=".txt" class="hidden">
        </div>
    </header>

    <div class="controls">
        <div class="search-box">
            <input id="searchInput" type="search" placeholder="搜索单词、词形、释义..." autocomplete="off">
        </div>
        <div class="filters">
            <select id="levelFilter">
                <option value="all">全部等级</option>
                <option value="A1">A1</option>
                <option value="A2">A2</option>
                <option value="B1">B1</option>
                <option value="B2">B2</option>
                <option value="C1">C1</option>
                <option value="C2">C2</option>
                <option value="unknown">未知等级</option>
            </select>
            <div class="segmented" id="knownFilterSeg">
                <button data-known="unknown" class="active">仅生词</button>
                <button data-known="all">全部</button>
            </div>
        </div>
        <div id="selectionActions" class="selection-actions hidden">
            <span id="selectedCount">已选择 0 个</span>
            <button id="btnMarkVisible">标记当前显示</button>
            <button id="btnUnmarkVisible">取消当前显示</button>
            <button id="btnExportSelection">导出所选</button>
            <button id="btnExitSelect">退出选择</button>
        </div>
    </div>

    <div class="stats-bar">
        <span id="statTotal">总词数: 0</span>
        <span id="statShown">当前显示: 0</span>
        <span id="statMarked">当前生词: 0</span>
    </div>

    <main id="wordGrid" class="word-grid"></main>

    <div id="pagination" class="pagination hidden">
        <button id="prevPage">上一页</button>
        <span id="pageInfo">1 / 1</span>
        <button id="nextPage">下一页</button>
    </div>

    <div id="toast" class="toast"></div>

    <div id="modal" class="modal hidden">
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-content" id="modalContent"></div>
    </div>

    <script>
        (function() {
            'use strict';

            // ---------- 常量 ----------
            const STORAGE_MARK = 'ngsl_mark_v3';
            const STORAGE_THEME = 'ngsl_theme';
            const STORAGE_PAGINATION = 'ngsl_pagination_mode';
            const PAGE_SIZE = 20;
            const ALLOWED_LEVELS = new Set(['A1', 'A2', 'B1', 'B2', 'C1', 'C2']);

            // ---------- 状态 ----------
            let allData = [];           // 固定 NGSL 词库
            let displayData = [];       // 当前经过筛选/排序/随机后的数据
            let markedRanks = new Set(); // 用户个人 Mark（存 Rank）
            let hasLocalMark = false;   // 本地是否已存在 Mark 数据

            let currentPage = 1;
            let sortCol = 'rank';
            let sortAsc = true;
            let searchQuery = '';
            let levelFilter = 'all';
            let knownFilter = 'unknown'; // 'unknown' | 'all'
            let paginationEnabled = true;
            let selectionMode = false;
            let randomMode = null;       // null | 'all' | 'unknown'
            let hideWordMode = false;

            // DOM 元素
            const $ = (id) => document.getElementById(id);
            const wordGrid = $('wordGrid');
            const searchInput = $('searchInput');
            const levelFilterEl = $('levelFilter');
            const knownFilterSeg = $('knownFilterSeg');
            const selectionActions = $('selectionActions');
            const selectedCount = $('selectedCount');
            const statTotal = $('statTotal');
            const statShown = $('statShown');
            const statMarked = $('statMarked');
            const pagination = $('pagination');
            const prevPageBtn = $('prevPage');
            const nextPageBtn = $('nextPage');
            const pageInfo = $('pageInfo');
            const toast = $('toast');
            const modal = $('modal');
            const modalContent = $('modalContent');
            const modalBackdrop = $('modalBackdrop');
            const importFile = $('importFile');
            const btnTheme = $('btnTheme');
            const btnSelectMode = $('btnSelectMode');
            const btnRandomAll = $('btnRandomAll');
            const btnRandomUnknown = $('btnRandomUnknown');
            const btnResetSort = $('btnResetSort');
            const btnReverse = $('btnReverse');
            const btnPagination = $('btnPagination');
            const btnExportMarkGlobal = $('btnExportMarkGlobal');
            const btnMarkVisible = $('btnMarkVisible');
            const btnUnmarkVisible = $('btnUnmarkVisible');
            const btnExportSelection = $('btnExportSelection');
            const btnExitSelect = $('btnExitSelect');

            // ---------- 辅助函数 ----------
            function esc(str) {
                if (str === null || str === undefined) return '';
                return String(str).replace(/[&<>"']/g, function(m) {
                    return {
                        '&': '&amp;',
                        '<': '&lt;',
                        '>': '&gt;',
                        '"': '&quot;',
                        "'": '&#39;'
                    }[m];
                });
            }

            function escAttr(str) {
                return esc(str);
            }

            function debounce(fn, ms) {
                let timer;
                return function(...args) {
                    clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), ms);
                };
            }

            function showToast(msg) {
                toast.textContent = msg;
                toast.classList.add('show');
                clearTimeout(toast._hideTimer);
                toast._hideTimer = setTimeout(() => toast.classList.remove('show'), 1800);
            }

            // ---------- 主题 ----------
            function loadTheme() {
                let theme = localStorage.getItem(STORAGE_THEME);
                if (theme !== 'light' && theme !== 'dark') {
                    theme = 'light';
                }
                document.documentElement.setAttribute('data-theme', theme);
                updateThemeButton(theme);
            }

            function updateThemeButton(theme) {
                btnTheme.textContent = theme === 'light' ? '🌙' : '☀️';
            }

            function toggleTheme() {
                const current = document.documentElement.getAttribute('data-theme');
                const next = current === 'light' ? 'dark' : 'light';
                document.documentElement.setAttribute('data-theme', next);
                localStorage.setItem(STORAGE_THEME, next);
                updateThemeButton(next);
            }

            // ---------- 分页偏好 ----------
            function loadPaginationPreference() {
                const saved = localStorage.getItem(STORAGE_PAGINATION);
                if (saved === 'unpaginate') {
                    paginationEnabled = false;
                } else {
                    paginationEnabled = true;
                }
                updatePaginationButton();
            }

            function savePaginationPreference() {
                localStorage.setItem(STORAGE_PAGINATION, paginationEnabled ? 'paginate' : 'unpaginate');
            }

            function updatePaginationButton() {
                btnPagination.textContent = paginationEnabled ? '分页' : '不分页';
            }

            function togglePagination() {
                paginationEnabled = !paginationEnabled;
                savePaginationPreference();
                updatePaginationButton();
                currentPage = 1;
                applyDisplay();
                render();
            }

            // ---------- Mark 本地存储 ----------
            function loadLocalMark() {
                const raw = localStorage.getItem(STORAGE_MARK);
                hasLocalMark = raw !== null;
                markedRanks = new Set();
                if (!hasLocalMark) return;
                try {
                    const arr = JSON.parse(raw);
                    if (!Array.isArray(arr)) throw new Error('mark is not array');
                    arr.forEach(n => {
                        if (Number.isInteger(n)) markedRanks.add(n);
                    });
                } catch (e) {
                    console.warn('[NGSL] Invalid localStorage mark, resetting', e);
                    markedRanks = new Set();
                    hasLocalMark = false;
                }
            }

            function saveLocalMark() {
                try {
                    const arr = [...markedRanks].sort((a, b) => a - b);
                    localStorage.setItem(STORAGE_MARK, JSON.stringify(arr));
                } catch (e) {
                    console.warn('[NGSL] Failed to save mark', e);
                }
            }

            // ---------- CSV 解析器（标准 CSV，支持引号、转义、换行）----------
            function parseCSV(text) {
                if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
                const rows = [];
                let row = [];
                let field = '';
                let inQuotes = false;

                for (let i = 0; i < text.length; i++) {
                    const c = text[i];
                    if (inQuotes) {
                        if (c === '"') {
                            if (i + 1 < text.length && text[i + 1] === '"') {
                                field += '"';
                                i++;
                            } else {
                                inQuotes = false;
                            }
                        } else {
                            field += c;
                        }
                    } else {
                        if (c === '"') {
                            inQuotes = true;
                        } else if (c === ',') {
                            row.push(field);
                            field = '';
                        } else if (c === '\n') {
                            row.push(field);
                            rows.push(row);
                            row = [];
                            field = '';
                        } else if (c === '\r') {
                            // 跳过 \r，\n 会触发换行
                        } else {
                            field += c;
                        }
                    }
                }
                if (field.length > 0 || row.length > 0) {
                    row.push(field);
                    rows.push(row);
                }

                if (rows.length < 2) return [];
                const headers = rows[0].map(h => h.trim());
                const data = [];
                for (let i = 1; i < rows.length; i++) {
                    const cells = rows[i];
                    if (cells.length === 0 || (cells.length === 1 && cells[0].trim() === '')) continue;
                    const obj = {};
                    headers.forEach((h, idx) => {
                        obj[h] = cells[idx] !== undefined ? cells[idx] : '';
                    });
                    obj.rank = Number(obj.rank);
                    obj.sfi = obj.sfi !== undefined && obj.sfi !== '' ? Number(obj.sfi) : null;
                    obj.u_value = obj.u_value !== undefined && obj.u_value !== '' ? Number(obj.u_value) : null;
                    data.push(obj);
                }
                return data;
            }

            function normalizeItem(raw) {
                return {
                    rank: Number(raw.rank),
                    word: String(raw.word || '').trim(),
                    forms: String(raw.forms || ''),
                    pron: String(raw.pron || ''),
                    pos: String(raw.pos || ''),
                    def_zh: String(raw.def_zh || ''),
                    def_en: String(raw.def_en || ''),
                    level: String(raw.level || ''),
                    sfi: raw.sfi !== undefined && raw.sfi !== null && !isNaN(Number(raw.sfi)) ? Number(raw.sfi) : null,
                    u_value: raw.u_value !== undefined && raw.u_value !== null && !isNaN(Number(raw.u_value)) ? Number(raw.u_value) : null
                };
            }

            // ---------- 数据加载 ----------
            async function loadNGSL() {
                try {
                    const res = await fetch('NGSL.json');
                    if (!res.ok) throw new Error('HTTP ' + res.status);
                    const json = await res.json();
                    if (!Array.isArray(json)) throw new Error('JSON is not array');
                    allData = json.map(normalizeItem);
                } catch (err) {
                    console.warn('[NGSL] JSON load failed, trying CSV...', err);
                    try {
                        const res = await fetch('NGSL.csv');
                        if (!res.ok) throw new Error('CSV HTTP ' + res.status);
                        const text = await res.text();
                        const parsed = parseCSV(text);
                        if (!parsed.length) throw new Error('CSV parsed empty');
                        allData = parsed.map(normalizeItem);
                    } catch (csvErr) {
                        console.error('[NGSL] CSV load also failed', csvErr);
                        throw new Error('无法加载 NGSL 数据');
                    }
                }
                if (!allData.length) throw new Error('NGSL data is empty');
            }

            async function loadUnknown() {
                const res = await fetch('NGSL_Unknown.txt');
                if (!res.ok) throw new Error('Unknown HTTP ' + res.status);
                const text = await res.text();
                const words = text.split(/\r?\n/)
                    .map(line => line.trim())
                    .filter(line => line.length > 0);
                const ranks = [];
                words.forEach(word => {
                    const found = allData.find(d => d.word.toLowerCase() === word.toLowerCase());
                    if (found) {
                        ranks.push(found.rank);
                    } else {
                        console.warn('[NGSL] Unknown word not found in NGSL:', word);
                    }
                });
                return ranks;
            }

            // ---------- 数据完整性校验 ----------
            function validateData() {
                if (allData.length === 0) return;
                if (allData.length !== 2809) {
                    console.warn('[NGSL] Data length is', allData.length, 'expected 2809');
                }
                const rankSet = new Set();
                const missing = [];
                const duplicates = [];
                allData.forEach(d => {
                    if (!Number.isInteger(d.rank)) {
                        console.error('[NGSL] Invalid rank:', d.rank);
                        return;
                    }
                    if (rankSet.has(d.rank)) {
                        duplicates.push(d.rank);
                    } else {
                        rankSet.add(d.rank);
                    }
                    if (!d.word) {
                        console.error('[NGSL] Empty word at rank', d.rank);
                    }
                });
                for (let r = 1; r <= 2809; r++) {
                    if (!rankSet.has(r)) missing.push(r);
                }
                if (duplicates.length) console.error('[NGSL] Duplicate ranks:', duplicates);
                if (missing.length) console.error('[NGSL] Missing ranks:', missing);

                // Level 检查
                const unknownLevels = new Set();
                allData.forEach(d => {
                    if (!ALLOWED_LEVELS.has(d.level)) {
                        unknownLevels.add(d.level);
                    }
                });
                if (unknownLevels.size) {
                    unknownLevels.forEach(lv => console.warn('[NGSL] Unknown level detected:', lv));
                }

                // 日志统计
                const stats = { A1: 0, A2: 0, B1: 0, B2: 0, C1: 0, C2: 0, Unknown: 0 };
                allData.forEach(d => {
                    if (ALLOWED_LEVELS.has(d.level)) stats[d.level]++;
                    else stats.Unknown++;
                });
                console.log('NGSL loaded:', allData.length, 'words');
                console.log('Level statistics:');
                console.table(stats);
            }

            // ---------- 数据流水线 ----------
            function matchesSearch(item) {
                const q = searchQuery.toLowerCase();
                return [item.word, item.forms, item.def_en, item.def_zh].some(v => {
                    return v && String(v).toLowerCase().includes(q);
                });
            }

            function getBaseFiltered() {
                let list = allData.slice();
                if (searchQuery.trim()) {
                    list = list.filter(matchesSearch);
                }
                if (levelFilter !== 'all') {
                    if (levelFilter === 'unknown') {
                        list = list.filter(d => !ALLOWED_LEVELS.has(d.level));
                    } else {
                        list = list.filter(d => d.level === levelFilter);
                    }
                }
                return list;
            }

            function applyDisplay() {
                let list = getBaseFiltered();

                if (randomMode === 'unknown') {
                    list = list.filter(d => markedRanks.has(d.rank));
                } else if (randomMode === 'all') {
                    // 全部随机：不过滤 known，但保留搜索和等级
                } else {
                    if (knownFilter === 'unknown') {
                        list = list.filter(d => markedRanks.has(d.rank));
                    }
                }

                if (randomMode === 'all' || randomMode === 'unknown') {
                    shuffle(list);
                } else {
                    if (sortCol === 'rank') {
                        list.sort((a, b) => sortAsc ? a.rank - b.rank : b.rank - a.rank);
                    } else if (sortCol === 'word') {
                        list.sort((a, b) => {
                            const cmp = a.word.localeCompare(b.word);
                            return sortAsc ? cmp : -cmp;
                        });
                    }
                }

                displayData = list;
                if (currentPage > Math.max(1, Math.ceil(displayData.length / PAGE_SIZE))) {
                    currentPage = 1;
                }
            }

            function shuffle(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
            }

            function getCurrentPageItems() {
                const searchActive = searchQuery.trim() !== '';
                if (searchActive || !paginationEnabled) {
                    return displayData;
                }
                const start = (currentPage - 1) * PAGE_SIZE;
                return displayData.slice(start, start + PAGE_SIZE);
            }

            // ---------- 渲染 ----------
            function render() {
                renderGrid();
                renderPagination();
                updateStats();
                updateSelectionUI();
            }

            function levelDisplay(item) {
                return ALLOWED_LEVELS.has(item.level) ? item.level : '未知';
            }

            function levelClass(item) {
                if (ALLOWED_LEVELS.has(item.level)) {
                    return 'level-' + item.level.toLowerCase();
                }
                return 'level-unknown';
            }

            function cardHTML(item) {
                const isMarked = markedRanks.has(item.rank);
                const lv = levelDisplay(item);
                const lvClass = levelClass(item);
                const defEn = item.def_en || '';
                const defZh = item.def_zh || '';
                const wordHiddenClass = hideWordMode ? 'word-hidden' : '';
                const defHiddenClass = hideWordMode ? '' : 'hidden';
                return `
                    <article class="word-card" data-rank="${item.rank}">
                        <div class="card-top">
                            <label class="mark-label ${selectionMode ? '' : 'hidden'}">
                                <input type="checkbox" class="mark-check" data-rank="${item.rank}" ${isMarked ? 'checked' : ''}>
                            </label>
                            <span class="rank">#${item.rank}</span>
                            <button class="detail-btn" data-rank="${item.rank}" title="查看详情">ⓘ</button>
                        </div>
                        <div class="word-wrap">
                            <div class="word-main ${wordHiddenClass}">${esc(item.word)}</div>
                            <div class="def-main ${defHiddenClass}">
                                <div class="def-en">${esc(defEn)}</div>
                                <div class="def-zh">${esc(defZh)}</div>
                            </div>
                        </div>
                        <div class="card-bottom">
                            <span class="level ${lvClass}">${esc(lv)}</span>
                        </div>
                    </article>
                `;
            }

            function renderGrid() {
                const items = getCurrentPageItems();
                if (!items.length) {
                    wordGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--muted);padding:40px;">没有符合条件的词条</div>';
                    return;
                }
                wordGrid.innerHTML = items.map(cardHTML).join('');
            }

            function renderPagination() {
                const searchActive = searchQuery.trim() !== '';
                const totalPages = Math.max(1, Math.ceil(displayData.length / PAGE_SIZE));
                if (searchActive || !paginationEnabled || displayData.length === 0) {
                    pagination.classList.add('hidden');
                    return;
                }
                pagination.classList.remove('hidden');
                if (currentPage > totalPages) currentPage = totalPages;
                pageInfo.textContent = `${currentPage} / ${totalPages}`;
                prevPageBtn.disabled = currentPage <= 1;
                nextPageBtn.disabled = currentPage >= totalPages;
            }

            function updateStats() {
                statTotal.textContent = '总词数: ' + allData.length;
                statShown.textContent = '当前显示: ' + displayData.length;
                statMarked.textContent = '当前生词: ' + markedRanks.size;
            }

            function updateSelectedCount() {
                selectedCount.textContent = '已选择 ' + markedRanks.size + ' 个';
            }

            function updateSelectionUI() {
                if (selectionMode) {
                    selectionActions.classList.remove('hidden');
                    wordGrid.classList.add('selection-mode');
                    btnSelectMode.textContent = '退出选择';
                } else {
                    selectionActions.classList.add('hidden');
                    wordGrid.classList.remove('selection-mode');
                    btnSelectMode.textContent = '选择';
                }
                updateSelectedCount();
            }

            // ---------- 详情弹窗 ----------
            function openModal(rank) {
                const item = allData.find(d => d.rank === rank);
                if (!item) return;
                const lv = levelDisplay(item);
                modalContent.innerHTML = `
                    <div class="modal-header">
                        <div class="modal-word">${esc(item.word)}</div>
                        <button class="modal-close" id="modalCloseBtn">×</button>
                    </div>
                    <div class="modal-body">
                        <div class="detail-row"><span class="detail-label">词性</span><span>${esc(item.pos || '—')}</span></div>
                        <div class="detail-row"><span class="detail-label">词形变化</span><span>${esc(item.forms || '—')}</span></div>
                        <div class="detail-row"><span class="detail-label">英文释义</span><span>${esc(item.def_en || '—')}</span></div>
                        <div class="detail-row"><span class="detail-label">发音</span><span>${esc(item.pron || '—')}</span></div>
                        <div class="detail-row"><span class="detail-label">中文释义</span><span>${esc(item.def_zh || '—')}</span></div>
                        <div class="detail-row"><span class="detail-label">等级</span><span>${esc(lv)}</span></div>
                        <div class="detail-row"><span class="detail-label">Rank</span><span>${item.rank}</span></div>
                        <div class="detail-row"><span class="detail-label">SFI</span><span>${item.sfi !== null && item.sfi !== undefined ? item.sfi : '—'}</span></div>
                        <div class="detail-row"><span class="detail-label">U Value</span><span>${item.u_value !== null && item.u_value !== undefined ? item.u_value : '—'}</span></div>
                    </div>
                `;
                modal.classList.remove('hidden');
                document.body.style.overflow = 'hidden';
                const closeBtn = $('modalCloseBtn');
                if (closeBtn) closeBtn.addEventListener('click', closeModal);
            }

            function closeModal() {
                modal.classList.add('hidden');
                document.body.style.overflow = '';
            }

            // ---------- 选择模式 ----------
            function enterSelectionMode() {
                selectionMode = true;
                randomMode = null;
                sortCol = 'rank';
                sortAsc = true;
                currentPage = 1;
                applyDisplay();
                render();
            }

            function exitSelectionMode() {
                selectionMode = false;
                applyDisplay();
                render();
            }

            function markVisible(shouldMark) {
                const items = getCurrentPageItems();
                items.forEach(item => {
                    if (shouldMark) markedRanks.add(item.rank);
                    else markedRanks.delete(item.rank);
                });
                saveLocalMark();
                renderGrid();
                updateStats();
                updateSelectedCount();
            }

            // ---------- 导出 / 导入 Mark ----------
            function exportMark() {
                const words = [...markedRanks]
                    .sort((a, b) => a - b)
                    .map(r => {
                        const item = allData.find(d => d.rank === r);
                        return item ? item.word : null;
                    })
                    .filter(Boolean);
                if (!words.length) {
                    showToast('没有可导出的词');
                    return;
                }
                const blob = new Blob([words.join('\n')], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'Mark.txt';
                a.click();
                URL.revokeObjectURL(url);
                showToast('已导出');
            }

            function importMarkFromFile(file) {
                file.text().then(text => {
                    const lines = text.split(/\r?\n/)
                        .map(line => line.trim())
                        .filter(line => line.length > 0);
                    const newRanks = [];
                    lines.forEach(word => {
                        const item = allData.find(d => d.word.toLowerCase() === word.toLowerCase());
                        if (item) {
                            newRanks.push(item.rank);
                        } else {
                            console.warn('[NGSL] Import word not found in NGSL:', word);
                        }
                    });
                    markedRanks = new Set(newRanks);
                    saveLocalMark();
                    applyDisplay();
                    render();
                    showToast('已导入');
                }).catch(err => {
                    console.error('[NGSL] Import failed', err);
                    showToast('导入失败');
                });
            }

            // ---------- 事件绑定 ----------
            function bindEvents() {
                btnTheme.addEventListener('click', toggleTheme);
                btnSelectMode.addEventListener('click', () => {
                    if (selectionMode) {
                        exitSelectionMode();
                    } else {
                        enterSelectionMode();
                    }
                });
                btnExitSelect.addEventListener('click', exitSelectionMode);
                btnRandomAll.addEventListener('click', () => {
                    if (selectionMode) exitSelectionMode();
                    randomMode = 'all';
                    currentPage = 1;
                    applyDisplay();
                    render();
                });
                btnRandomUnknown.addEventListener('click', () => {
                    if (selectionMode) exitSelectionMode();
                    randomMode = 'unknown';
                    currentPage = 1;
                    applyDisplay();
                    render();
                });
                btnResetSort.addEventListener('click', () => {
                    randomMode = null;
                    sortCol = 'rank';
                    sortAsc = true;
                    currentPage = 1;
                    applyDisplay();
                    render();
                });
                btnReverse.addEventListener('click', () => {
                    hideWordMode = !hideWordMode;
                    render();
                });
                btnPagination.addEventListener('click', togglePagination);
                btnExportMarkGlobal.addEventListener('click', exportMark);
                btnMarkVisible.addEventListener('click', () => markVisible(true));
                btnUnmarkVisible.addEventListener('click', () => markVisible(false));
                btnExportSelection.addEventListener('click', exportMark);

                searchInput.addEventListener('input', debounce(function() {
                    searchQuery = searchInput.value;
                    currentPage = 1;
                    applyDisplay();
                    render();
                }, 300));

                levelFilterEl.addEventListener('change', () => {
                    levelFilter = levelFilterEl.value;
                    currentPage = 1;
                    applyDisplay();
                    render();
                });

                knownFilterSeg.addEventListener('click', (e) => {
                    const btn = e.target.closest('button[data-known]');
                    if (!btn) return;
                    knownFilter = btn.dataset.known;
                    knownFilterSeg.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentPage = 1;
                    applyDisplay();
                    render();
                });

                prevPageBtn.addEventListener('click', () => {
                    if (currentPage > 1) {
                        currentPage--;
                        render();
                    }
                });
                nextPageBtn.addEventListener('click', () => {
                    const totalPages = Math.ceil(displayData.length / PAGE_SIZE);
                    if (currentPage < totalPages) {
                        currentPage++;
                        render();
                    }
                });

                wordGrid.addEventListener('click', (e) => {
                    const card = e.target.closest('.word-card');
                    if (!card) return;
                    const rank = Number(card.dataset.rank);
                    if (e.target.closest('.mark-check')) return;
                    if (e.target.closest('.detail-btn')) {
                        openModal(rank);
                        return;
                    }
                    if (hideWordMode) {
                        card.classList.toggle('revealed');
                        return;
                    }
                    openModal(rank);
                });

                wordGrid.addEventListener('change', (e) => {
                    if (e.target.matches('.mark-check')) {
                        const rank = Number(e.target.dataset.rank);
                        if (e.target.checked) {
                            markedRanks.add(rank);
                        } else {
                            markedRanks.delete(rank);
                        }
                        saveLocalMark();
                        updateStats();
                        updateSelectedCount();
                    }
                });

                modalBackdrop.addEventListener('click', closeModal);

                document.addEventListener('keydown', (e) => {
                    if (e.key === '/' && document.activeElement !== searchInput) {
                        e.preventDefault();
                        searchInput.focus();
                    }
                    if (e.key === 'Escape') {
                        if (!modal.classList.contains('hidden')) {
                            closeModal();
                        } else if (selectionMode) {
                            exitSelectionMode();
                        }
                    }
                });

                importFile.addEventListener('change', () => {
                    if (importFile.files && importFile.files[0]) {
                        importMarkFromFile(importFile.files[0]);
                    }
                    importFile.value = '';
                });
            }

            // ---------- 初始化 ----------
            async function init() {
                loadTheme();
                loadPaginationPreference();
                loadLocalMark();

                try {
                    await loadNGSL();
                } catch (err) {
                    console.error('[NGSL] Fatal:', err);
                    wordGrid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);">数据加载失败，请确认 NGSL.json 或 NGSL.csv 存在</div>';
                    return;
                }

                if (!hasLocalMark) {
                    try {
                        const ranks = await loadUnknown();
                        markedRanks = new Set(ranks);
                        saveLocalMark();
                        console.log('Mark initialized from NGSL_Unknown.txt:', ranks.length, 'words');
                    } catch (e) {
                        console.warn('[NGSL] Failed to load NGSL_Unknown.txt, starting with empty mark', e);
                        markedRanks = new Set();
                        saveLocalMark();
                    }
                    hasLocalMark = true;
                }

                validateData();
                applyDisplay();
                render();
                bindEvents();
                console.log('Mark loaded:', markedRanks.size, 'words');
            }

            init();
        })();
    </script>
</body>
</html>
